<style>
/* Layout: 手機優先的單頁 App — 上方標題列、中間內容、下方分頁列＋記一筆按鈕、從下方滑出的表單 */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#18202e; --muted:#69707f; --line:#dfe2ea;
  --accent:#2a4d8f; --accent-ink:#ffffff; --accent-soft:#e6ecf8;
  --exp:#23824f; --inc:#c8423b; --loan:#9a5b12; --loan-soft:#fbf0df;
  --shadow:0 1px 2px rgba(24,32,46,.06),0 4px 16px rgba(24,32,46,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1b1e26; --ink:#e8eaf0; --muted:#9aa1b0; --line:#2b303b;
  --accent:#8aa8ec; --accent-ink:#0f1730; --accent-soft:#232c42;
  --exp:#5cc48a; --inc:#ef7b72; --loan:#e3a95a; --loan-soft:#2e2618;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --ink:#e8eaf0; --muted:#9aa1b0; --line:#2b303b;
  --accent:#8aa8ec; --accent-ink:#0f1730; --accent-soft:#232c42;
  --exp:#5cc48a; --inc:#ef7b72; --loan:#e3a95a; --loan-soft:#2e2618;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--exp)} .inc{color:var(--inc)} .loan{color:var(--loan)} .muted{color:var(--muted)}

/* shell */
#app{max-width:640px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:700;text-wrap:balance}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--accent)}
main{padding-inline:16px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;max-width:640px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;margin-top:-22px;box-shadow:0 6px 16px rgba(42,77,143,.35);gap:0}
nav.tabs .fab span{font-size:24px;line-height:1}

/* blocks */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar button{border:0;background:none;font-size:22px;color:var(--accent);width:40px;height:40px;border-radius:50%}
.monthbar strong{font-size:17px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.summary .num{font-size:18px;overflow-wrap:anywhere}
.extra{font-size:12px;color:var(--muted);margin-top:8px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.daygroup{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 4px}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row .dot{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.dot.exp{background:color-mix(in srgb,var(--exp) 14%,transparent)}
.dot.inc{background:color-mix(in srgb,var(--inc) 14%,transparent)}
.dot.loan{background:var(--loan-soft)}
.dot.tr{background:var(--accent-soft);color:var(--accent)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{flex:none;text-align:right;font-size:15px}
.row .amt small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.sectionhead h2{font-size:14px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.06em}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.loan{background:var(--loan-soft);color:var(--loan)}
.actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions4 button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.actions4 button small{font-weight:400;color:var(--muted);font-size:11px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--inc);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--exp)}
.bar .fill.inc{background:var(--inc)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bigtotal{font-size:28px;line-height:1.2}

.stmt{display:flex;flex-direction:column}
.st-h{font-size:12.5px;color:var(--muted);letter-spacing:.08em;padding:14px 0 4px;border-bottom:1px solid var(--line)}
.st-h:first-child{padding-top:0}
.st-r,.st-t,.st-net{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.st-r span:first-child,.st-t span:first-child{min-width:0;overflow-wrap:anywhere}
.st-sub{padding:3px 0 3px 1.2em;font-size:13px;color:var(--muted)}
.st-t{border-top:1px solid var(--line);font-weight:700}
.st-net{border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:700;font-size:17px}
.tabs5 button{font-size:13.5px;padding:8px 0}
.mrow{gap:6px;padding:6px 8px 6px 4px}
.mrow.sub{padding-left:22px}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px}
.mmain .t,.mmain .s{max-width:100%}
.mv{flex:none;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--accent);font-size:16px}
.mv:disabled{opacity:.3;cursor:default}
.ishidden .t{color:var(--muted);text-decoration:line-through}
.recrow{gap:12px;cursor:text}
.recrow input{flex:none;width:9.5em;max-width:45%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);text-align:right}
.addsub{color:var(--accent);font-size:13.5px;padding:10px 14px 10px 32px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
#sheet.open{opacity:1}
#sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .2s}
#sheet.open .panel{transform:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheethead h2{font-size:18px;margin:0}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.field input.amount{font-family:var(--f-num);font-size:28px;padding:8px 12px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.formbtns{display:flex;gap:10px}
.formbtns .btn{flex:1}
.selbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;justify-content:center;padding-inline:16px}
.selbar div{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:608px;width:100%}
.selbar div span{flex:1}
.selbar .btn{background:var(--accent);color:var(--accent-ink)}

/* login */
.login{max-width:380px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 16px 32px;display:flex;flex-direction:column;gap:18px}
.login h1{font-size:28px;margin:0}
.login p{margin:0;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spinner{padding:40px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){#sheet,#sheet .panel{transition:none}}
</style>
</head>

  const splitTop = s => { const out = []; let depth = 0, cur = ''; for (const ch of s) { if (ch === '(') depth++; if (ch === ')') depth--; if (ch === ',' && !depth) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; };
  class Q {
    constructor(t) { this.t = t; this.f = []; this.op = 'select'; this.ord = []; this.lim = null; this.rng = null; this.cnt = false; this.one = false; this.ret = false; }
    select(_c, o) { if (this.op === 'select') this.cnt = o?.count === 'exact'; else this.ret = true; return this; }
    insert(r) { this.op = 'insert'; this.payload = r; return this; }
    update(r) { this.op = 'update'; this.payload = r; return this; }
    delete() { this.op = 'delete'; return this; }
    eq(k, v) { this.f.push(r => String(r[k]) === String(v)); return this; }
    is(k) { this.f.push(r => r[k] == null); return this; }
    in(k, arr) { const s = arr.map(String); this.f.push(r => s.includes(String(r[k]))); return this; }
    ilike(k, p) { const s = p.replace(/%/g, '').toLowerCase(); this.f.push(r => (r[k] || '').toLowerCase().includes(s)); return this; }
    gte(k, v) { this.f.push(r => r[k] >= v); return this; }
    lt(k, v) { this.f.push(r => r[k] < v); return this; }
    or(expr) {
      const parts = splitTop(expr).map(p => { const [col, op, ...rest] = p.split('.'); const val = rest.join('.');
        return op === 'in' ? (r => val.replace(/[()]/g, '').split(',').includes(String(r[col]))) : (r => String(r[col]) === val); });
      this.f.push(r => parts.some(fn => fn(r))); return this;
    }
    order(k, o = {}) { this.ord.push([k, o.ascending !== false]); return this; }

    exec() {

        const rows = (Array.isArray(this.payload) ? this.payload : [this.payload]).map(p => ({ ...p }));

          r.id = Math.max(0, ...table.map(x => x.id)) + 1;

          if (this.t === 'transactions') for (const k of ['counterparty_id', 'to_account_id', 'to_amount', 'category_id', 'quantity', 'unit_price', 'fee', 'trade_side', 'memo']) r[k] ??= null;

          if (this.t === 'categories') Object.assign(r, { hidden: false, parent_id: r.parent_id ?? null });
          table.push(r);
        }
        return { data: this.ret ? (this.one ? rows[0] : rows) : null, error: null };
      }
      if (this.op === 'update') { const rows = table.filter(match); rows.forEach(r => Object.assign(r, this.payload)); return { data: null, error: null }; }
      if (this.op === 'delete') {
        const gone = table.filter(match), fk = { data: null, error: { code: '23503', message: 'still referenced' } };
        if (this.t === 'accounts' && gone.some(a => db.transactions.some(t => t.account_id === a.id || t.to_account_id === a.id))) return fk;
        if (this.t === 'categories' && gone.some(c => db.transactions.some(t => t.category_id === c.id) || db.categories.some(k => k.parent_id === c.id))) return fk;
        db[this.t] = table.filter(r => !match(r)); return { data: null, error: null };
      }
      let rows = (views[this.t] ? views[this.t]() : table).filter(match).map(r => ({ ...r }));
      for (const [k, asc] of [...this.ord].reverse()) rows.sort((a, b) => { const x = a[k], y = b[k]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
      const count = rows.length;
      if (this.rng) rows = rows.slice(this.rng[0], this.rng[1] + 1);
      if (this.lim != null) rows = rows.slice(0, this.lim);
      return { data: this.one ? rows[0] ?? null : rows, error: null, count: this.cnt ? count : null };
    }

const isDebt = a => isRec(a) || isPay(a);
const LOAN = {
  lend:    { label: '借出', note: '我借錢給對方', debt: 'receivable', dir: 'out' },
  collect: { label: '收款', note: '對方還我錢',   debt: 'receivable', dir: 'in' },
  borrow:  { label: '借入', note: '我向對方借錢', debt: 'payable',    dir: 'in' },
  repay:   { label: '還款', note: '我還對方錢',   debt: 'payable',    dir: 'out' },
};
function loanType(t) {
  if (t.kind !== 'transfer') return null;
  const A = acct(t.account_id), B = acct(t.to_account_id);
  if (isRec(B)) return 'lend'; if (isRec(A)) return 'collect';
  if (isPay(A)) return 'borrow'; if (isPay(B)) return 'repay';
  return null;
}
const isLoanTx = t => isDebt(acct(t.account_id)) || isDebt(acct(t.to_account_id));
// 這筆交易對某帳戶餘額的影響
function deltaFor(t, accountId) {
  let d = 0;
  if (t.account_id === accountId) d += (t.kind === 'expense' || t.kind === 'transfer') ? -t.amount : +t.amount;
  if (t.kind === 'transfer' && t.to_account_id === accountId) d += +(t.to_amount ?? t.amount);
  return d;
}
// 這筆交易對借貸對象餘額的影響（正 = 對方欠我）
function personDelta(t) {
  const A = acct(t.account_id), B = acct(t.to_account_id), out = [];
  if (isDebt(A)) out.push([A.currency, (t.kind === 'expense' || t.kind === 'transfer') ? -t.amount : +t.amount]);
  if (t.kind === 'transfer' && isDebt(B)) out.push([B.currency, +(t.to_amount ?? t.amount)]);
  return out;
}

/* ---------- transaction row ---------- */
function catLabel(id) { const c = S.catMap.get(id); return c ? c.name : ''; }
// 把一筆交易翻成會計分錄：借方、貸方、金額
function journal(t) {
  const A = acct(t.account_id), B = acct(t.to_account_id);
  const an = A?.name || '?', bn = B?.name || '?', cn = catLabel(t.category_id) || (t.kind === 'expense' ? '未分類支出' : '未分類收入');
  const amt = +t.amount, neg = amt < 0, abs = Math.abs(amt), cur = A?.currency;
  switch (t.kind) {
    case 'expense': return neg ? { dr: an, cr: cn, amount: abs, cur, sign: '+' } : { dr: cn, cr: an, amount: abs, cur, sign: '−' };
    case 'income': return neg ? { dr: cn, cr: an, amount: abs, cur, sign: '−' } : { dr: an, cr: cn, amount: abs, cur, sign: '+' };
    case 'transfer': return { dr: bn, cr: an, amount: abs, cur, sign: '' };
    case 'opening_balance': return neg ? { dr: '期初權益', cr: an, amount: abs, cur, sign: '−' } : { dr: an, cr: '期初權益', amount: abs, cur, sign: '+' };
    default: return neg ? { dr: '餘額調整', cr: an, amount: abs, cur, sign: '−' } : { dr: an, cr: '餘額調整', amount: abs, cur, sign: abs ? '+' : '' };
  }
}
function txRow(t, { showDate = false, selectable = false, accountId = null, person = false } = {}) {
  const A = acct(t.account_id), B = acct(t.to_account_id), lt = loanType(t);
  const cp = t.counterparty_id ? S.cpMap.get(t.counterparty_id) : null;
  let title, cls, dot, amtHtml;
  const d = new Date(t.occurred_at);
  const when = showDate ? `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}` : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const J = journal(t);
  let amount = J.amount, cur = J.cur, sign = J.sign;
  if (t.trade_side) {
    const inv = t.trade_side === 'buy' ? (t.kind === 'transfer' ? B : A) : A;
    const q = t.quantity != null ? ` ${qf.format(t.quantity)} 股` : '';
    if (t.kind !== 'transfer') { title = `補登股數 · ${inv?.name || ''}${q}`; dot = '補'; cls = 'tr'; }
    else if (t.trade_side === 'buy') { title = `買進 · ${inv?.name || ''}${q}${t.unit_price != null ? ' @' + qf.format(t.unit_price) : ''}`; dot = '買'; cls = 'tr'; }
    else {
      const pl = (t.to_amount ?? t.amount) - t.amount;
      title = `賣出 · ${inv?.name || ''}${q}${t.unit_price != null ? ' @' + qf.format(t.unit_price) : ''}`; dot = '賣'; cls = pl >= 0 ? 'inc' : 'exp';
      amount = Math.abs(pl); sign = pl > 0 ? '+' : pl < 0 ? '−' : ''; cur = A?.currency;
      title += '　損益';
    }
  } else if (lt) {
    const L = LOAN[lt], mine = L.dir === 'out' ? A : B;
    title = L.label + ' · ' + (cp ? cp.name : '未指定對象'); cls = 'loan'; dot = L.label[0];
    amount = L.dir === 'out' ? t.amount : (t.to_amount ?? t.amount); cur = mine?.currency; sign = L.dir === 'out' ? '−' : '+';
  } else if (t.kind === 'expense') {
    title = catLabel(t.category_id) || '支出'; cls = isPay(A) ? 'loan' : (t.amount < 0 ? 'inc' : 'exp'); dot = (title[0] || '支');
    if (t.amount < 0) title += ' · 退款沖銷';
    if (isPay(A)) title += ' · ' + (cp ? cp.name + '代付' : '他人代付');
  } else if (t.kind === 'income') {
    title = catLabel(t.category_id) || '收入'; cls = t.amount < 0 ? 'exp' : 'inc'; dot = (title[0] || '收');
    if (t.amount < 0) title += ' · 沖回';
  } else if (t.kind === 'transfer') {
    title = isInv(B) ? '轉入投資' : isInv(A) ? '投資轉出' : '轉帳'; cls = 'tr'; dot = '轉';
  } else {
    title = t.kind === 'opening_balance' ? '期初餘額' : '餘額調整'; cls = 'tr'; dot = t.kind === 'opening_balance' ? '初' : '調';
  }
  const sub = `借 ${J.dr}　貸 ${J.cr}`;
  if (accountId != null) { const dl = deltaFor(t, accountId); amount = Math.abs(dl); cur = acct(accountId)?.currency; sign = dl < 0 ? '−' : dl > 0 ? '+' : ''; }
  if (person) { const pd = personDelta(t)[0]; if (pd) { amount = Math.abs(pd[1]); cur = pd[0]; sign = pd[1] > 0 ? '+' : '−'; } }
  const amtCls = cls === 'tr' ? '' : cls;
  amtHtml = `<span class="num ${amtCls}">${sign}${CUR_SIGN[cur] ?? (cur ? cur + ' ' : '')}${nf.format(Math.abs(amount))}</span><small>${when}</small>`;
  const memo = t.memo ? ` · ${esc(t.memo)}` : '';
  return `<div class="row" data-tx="${t.id}" role="button" tabindex="0">
    ${selectable ? `<input type="checkbox" data-sel="${t.id}" aria-label="選取" ${S.sel.has(t.id) ? 'checked' : ''}>` : ''}
    <span class="dot ${cls}">${esc(dot)}</span>
    <span class="main"><span class="t">${esc(title)}</span><span class="s">${esc(sub)}${memo}</span></span>
    <span class="amt">${amtHtml}</span></div>`;
}
function bindRows(root, txs) {
  const byId = new Map(txs.map(t => [t.id, t]));
  $$('.row[data-tx]', root).forEach(r => {
    const open = e => { if (e.target.matches('input[data-sel]')) return; const t = byId.get(+r.dataset.tx); if (t) openForm({ tx: t }); };
    r.onclick = open; r.onkeydown = e => { if (e.key === 'Enter') open(e); };
  });
  $$('input[data-sel]', root).forEach(c => c.onchange = () => { const id = +c.dataset.sel; c.checked ? S.sel.add(id) : S.sel.delete(id); updateSelbar(); });
}
function updateSelbar() { const b = $('#selbar'); if (!b) return; b.hidden = !S.sel.size; $('#selcount').textContent = `已選 ${S.sel.size} 筆`; }

/* ---------- 流水 ---------- */
async function viewFlow() {
  const v = $('#view'), L = S.ledger.id, m = S.month;
  const label = `${m.getFullYear()} 年 ${m.getMonth() + 1} 月`;
  const fresh = S.accts.every(a => Math.abs(S.bal.get(a.id) || 0) < 0.005);
  v.innerHTML = `
    ${fresh ? `<div class="card"><strong>第一次使用？</strong><p class="hint" style="margin:4px 0 12px">先把每個帳戶現在有多少錢、信用卡欠多少填進來，之後的餘額和淨資產才會準。沒有的帳戶可以先新增。</p>
      <div class="two"><button class="btn" id="startRec">盤點帳戶餘額</button><button class="btn ghost" id="startAdd">＋ 新增帳戶</button></div></div>` : ''}
    <div class="search"><input id="q" type="search" placeholder="搜尋備註（全部時間）" value="${esc(S.q)}" aria-label="搜尋備註"></div>
    ${S.q ? '' : `<div class="card"><div class="monthbar"><button id="prev" aria-label="上個月">‹</button><strong>${label}</strong><button id="next" aria-label="下個月">›</button></div>
      <div class="summary" id="sum"><div><small>支出</small><span class="num exp">…</span></div><div><small>收入</small><span class="num inc">…</span></div><div><small>結餘</small><span class="num">…</span></div></div><div class="extra" id="sumx"></div></div>`}
    <div id="days"><div class="spinner">載入中…</div></div>`;
  if (fresh) { $('#startRec').onclick = () => reconcile(); $('#startAdd').onclick = () => editAccount(null); }
  const q = $('#q'); let timer;
  q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { S.q = q.value.trim(); viewFlow().then(() => { const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); }, 400); };
  if (!S.q) { $('#prev').onclick = () => { S.month = addMonths(S.month, -1); viewFlow(); }; $('#next').onclick = () => { S.month = addMonths(S.month, 1); viewFlow(); }; }
  let txs;
  if (S.q) {
    const r = await sb.from('transactions').select(TX_COLS).eq('ledger_id', L).ilike('memo', `%${S.q}%`).order('occurred_at', { ascending: false }).limit(300);
    if (r.error) throw r.error; txs = r.data;
  } else {
    txs = await fetchAll(() => sb.from('transactions').select(TX_COLS).eq('ledger_id', L)
      .gte('occurred_at', m.toISOString()).lt('occurred_at', addMonths(m, 1).toISOString()).order('occurred_at', { ascending: false }));
    const tot = {};
    for (const t of txs) {
      if (t.kind !== 'expense' && t.kind !== 'income') continue;
      const c = acct(t.account_id)?.currency || 'TWD'; tot[c] ??= { e: 0, i: 0 }; tot[c][t.kind === 'expense' ? 'e' : 'i'] += +t.amount;
    }
    const tw = tot.TWD || { e: 0, i: 0 };
    $('#sum').innerHTML = `<div><small>支出</small><span class="num exp">${money(tw.e)}</span></div><div><small>收入</small><span class="num inc">${money(tw.i)}</span></div><div><small>結餘</small><span class="num">${money(tw.i - tw.e)}</span></div>`;
    const others = Object.entries(tot).filter(([c]) => c !== 'TWD');
    $('#sumx').textContent = others.length ? '外幣另計：' + others.map(([c, x]) => `${c} 支出 ${nf.format(x.e)}${x.i ? ' / 收入 ' + nf.format(x.i) : ''}`).join('，') : '';
  }
  const box = $('#days');
  if (!txs.length) { box.innerHTML = `<div class="card empty">${S.q ? '找不到符合的紀錄。' : '這個月還沒有紀錄。按下方「記一筆」開始。'}</div>`; return; }
  const groups = new Map();
  for (const t of txs) { const k = dayKey(new Date(t.occurred_at)); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  box.innerHTML = [...groups].map(([k, list]) => {
    const d = new Date(list[0].occurred_at);
    const de = list.filter(t => t.kind === 'expense' && (acct(t.account_id)?.currency || 'TWD') === 'TWD').reduce((s, t) => s + +t.amount, 0);
    return `<div class="daygroup"><div class="dayhead"><span>${S.q ? d.getFullYear() + '/' : ''}${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）</span><span class="num">${de ? '支出 ' + money(de) : ''}</span></div>
      <div class="list">${list.map(t => txRow(t)).join('')}</div></div>`;
  }).join('');
  box.style.display = 'flex'; box.style.flexDirection = 'column'; box.style.gap = '10px';
  bindRows(box, txs);
}

/* ---------- 帳戶 ---------- */
const GROUPS = [
  ['現金', ['cash']], ['電子錢包與儲值', ['e_wallet', 'stored_value']], ['銀行', ['bank']], ['信用卡', ['credit_card']],
  ['投資', ['stock', 'fund', 'investment']], ['債權與債務', ['receivable', 'payable']],
];
const TYPE_LABEL = { cash: '現金', e_wallet: '電子錢包', stored_value: '儲值卡', bank: '銀行', credit_card: '信用卡', stock: '股票', fund: '基金',
                     investment: '其他投資', receivable: '應收款項', payable: '應付款項' };
const CURRENCIES = ['TWD', 'USD', 'JPY', 'EUR', 'CNY', 'HKD', 'AUD', 'GBP', 'SGD', 'KRW', 'THB', 'VND'];
const natureOf = t => (t === 'credit_card' || t === 'payable') ? 'liability' : t === 'receivable' ? 'receivable' : 'asset';
const isLiabType = t => natureOf(t) === 'liability';
// 盤點：填每個帳戶的實際餘額，差額記成期初餘額（帳戶還沒有金額時）或餘額調整
function reconcile() {
  const rows = allGroups().map(([name, types]) => {
    const list = groupAccts(types, a => !a.hidden); if (!list.length) return '';
    const liab = types.some(isLiabType), inv = types.some(t => INV_TYPES.includes(t));
    return `<div class="sectionhead"><h2>${name}${liab ? '（填欠款）' : inv ? '（填成本）' : ''}</h2></div><div class="list">${list.map(a => {
      const b = S.bal.get(a.id) || 0, shown = isLiabType(a.account_type) ? -b : b;
      return `<label class="row recrow" for="rc${a.id}"><span class="main"><span class="t">${esc(a.name)}</span><span class="s">目前 ${money(shown, a.currency)}</span></span>
        <input id="rc${a.id}" data-rc="${a.id}" class="num" inputmode="decimal" placeholder="${nf.format(shown)}" aria-label="${esc(a.name)} 實際金額"></label>`; }).join('')}</div>`;
  }).join('');
  openSheet(`<div class="sheethead"><h2>盤點餘額</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
    <form class="form" id="rf">
      <p class="hint" style="margin:0">只要填和目前不一樣的帳戶，空白的不會變動。信用卡和應付款項填「欠多少」。系統會把差額記成一筆調整；帳戶原本是 0 的，會記成期初餘額。</p>
      <div class="field"><label for="rcd">盤點日期</label><input id="rcd" type="date" value="${toLocalInput(new Date()).slice(0, 10)}"></div>
      ${rows}
      <div class="card" style="box-shadow:none;background:var(--bg);padding:12px" id="rsum">尚未填寫任何帳戶。</div>
      <p class="hint" id="rerr" style="color:var(--inc)"></p>
      <button class="btn" type="submit">儲存盤點</button>
    </form>`, root => {
    const collect = () => {
      const out = [];
      for (const inp of $$('[data-rc]', root)) {
        const raw = inp.value.replace(/,/g, '').trim(); if (raw === '') continue;
        const n = parseFloat(raw); if (!isFinite(n)) return { err: `「${acct(+inp.dataset.rc).name}」的金額格式不對。` };
        const a = acct(+inp.dataset.rc), cur = S.bal.get(a.id) || 0, target = isLiabType(a.account_type) ? -n : n, diff = Math.round((target - cur) * 100) / 100;
        if (Math.abs(diff) >= 0.005) out.push({ a, cur, diff });
      }
      return { out };
    };
    const upd = () => {
      const { out, err } = collect(); const box = $('#rsum', root);
      if (err) { box.textContent = err; return; }
      box.innerHTML = out.length ? `會記錄 ${out.length} 筆：` + out.map(x => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.a.name)}${Math.abs(x.cur) < 0.005 ? '（期初）' : ''}</span><span class="num">${money(x.diff, x.a.currency, true)}</span></div>`).join('') : '尚未填寫任何帳戶，或填的金額和目前一樣。';
    };
    $$('[data-rc]', root).forEach(i => i.oninput = upd);
    $('#rf', root).onsubmit = async e => {
      e.preventDefault();
      const { out, err } = collect(); if (err) return $('#rerr', root).textContent = err;
      if (!out.length) return $('#rerr', root).textContent = '沒有需要調整的帳戶。';
      const d = new Date($('#rcd', root).value + 'T00:00'); if (isNaN(d)) return $('#rerr', root).textContent = '日期格式不對。';
      const rows = out.map(x => ({ ledger_id: S.ledger.id, account_id: x.a.id, amount: x.diff, occurred_at: d.toISOString(),
        kind: Math.abs(x.cur) < 0.005 ? 'opening_balance' : 'balance_adjustment', memo: Math.abs(x.cur) < 0.005 ? '期初餘額' : '盤點調整' }));
      const { error } = await sb.from('transactions').insert(rows);
      if (error) return $('#rerr', root).textContent = error.message;
      closeSheet(); toast(`已盤點 ${rows.length} 個帳戶`); await reloadAll();
    };
  });
}
const bySort = (a, b) => ((a.sort_order ?? 1e9) - (b.sort_order ?? 1e9)) || (a.id - b.id);
const otherTypes = () => { const known = new Set(GROUPS.flatMap(g => g[1])); return [...new Set(S.accts.map(a => a.account_type).filter(t => !known.has(t)))]; };
const allGroups = () => [...GROUPS, ['其他', otherTypes()]];
const groupTypes = t => (allGroups().find(g => g[1].includes(t)) || [null, [t]])[1];
const groupAccts = (types, filter = () => true) => S.accts.filter(a => types.includes(a.account_type) && filter(a)).sort(bySort);
const nextSort = list => Math.max(0, ...list.map(x => x.sort_order || 0)) + 1;
// 上移／下移：交換後把同組重新編號 1..n，只更新有變動的列
async function reorder(table, siblings, id, dir) {
  const list = siblings.slice(), i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const ups = list.map((x, k) => [x, k + 1]).filter(([x, n]) => x.sort_order !== n);
  const rs = await Promise.all(ups.map(([x, n]) => sb.from(table).update({ sort_order: n }).eq('id', x.id)));
  const bad = rs.find(r => r.error); if (bad) throw bad.error;
  await loadRef();
}
async function viewAccts() {
  const v = $('#view');
  const net = {};
  for (const a of S.accts) { if (a.hidden) continue; const b = S.bal.get(a.id) || 0; net[a.currency] = (net[a.currency] || 0) + b; }
  const html = allGroups().map(([name, types]) => {
    const list = groupAccts(types, a => !a.hidden && (S.showZero || Math.abs(S.bal.get(a.id) || 0) >= 0.005));
    if (!list.length) return '';
    const sub = {}; list.forEach(a => sub[a.currency] = (sub[a.currency] || 0) + (S.bal.get(a.id) || 0));
    return `<div class="sectionhead"><h2>${name}</h2><span class="num muted">${Object.entries(sub).map(([c, x]) => money(x, c)).join(' · ')}</span></div>
      <div class="list">${list.map(a => { const b = S.bal.get(a.id) || 0;
        return `<button class="row" data-acct="${a.id}"><span class="main"><span class="t">${esc(a.name)}</span>${a.currency !== 'TWD' ? `<span class="s">${a.currency}</span>` : ''}</span><span class="amt num ${b < 0 ? 'exp' : ''}">${money(b, a.currency)}</span></button>`; }).join('')}</div>`;
  }).join('');
  v.innerHTML = `
    <div class="card"><small class="muted">淨資產（台幣）</small><div class="num bigtotal">${money(net.TWD || 0)}</div>
      ${Object.entries(net).filter(([c]) => c !== 'TWD').length ? `<div class="extra">外幣：${Object.entries(net).filter(([c]) => c !== 'TWD').map(([c, x]) => money(x, c)).join('，')}</div>` : ''}</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label class="toggle" style="flex:1"><input type="checkbox" id="zero" ${S.showZero ? 'checked' : ''}> 顯示餘額為 0 的帳戶</label>
      <button class="btn small ghost" id="addAcct">＋ 新增帳戶</button><button class="btn small ghost" id="recAcct">盤點</button><button class="btn small ghost" id="mgAcct">排序與隱藏</button></div>
    ${html}
    <div class="list"><button class="row" id="toLoans"><span class="dot loan">人</span><span class="main"><span class="t">借貸對象</span><span class="s">按人查看應收、應付款項</span></span><span class="amt muted">›</span></button></div>`;
  $('#zero').onchange = e => { S.showZero = e.target.checked; LS.set('showZero', S.showZero); viewAccts(); };
  $('#toLoans').onclick = () => go('loans');
  $('#addAcct').onclick = () => editAccount(null);
  $('#recAcct').onclick = () => reconcile();
  $('#mgAcct').onclick = () => manageAccounts();
  $$('[data-acct]', v).forEach(b => b.onclick = () => openAccount(+b.dataset.acct));
}
function manageAccounts() {
  const rows = allGroups().map(([name, types]) => {
    const list = groupAccts(types); if (!list.length) return '';
    return `<div class="sectionhead"><h2>${name}</h2></div><div class="list">${list.map((a, i) => `<div class="row mrow${a.hidden ? ' ishidden' : ''}">
      <button type="button" class="mmain" data-edit="${a.id}"><span class="t">${esc(a.name)}</span><span class="s">${TYPE_LABEL[a.account_type] || a.account_type}${a.currency !== 'TWD' ? '・' + a.currency : ''}${a.hidden ? '・已隱藏' : ''}</span></button>
      <button type="button" class="mv" data-mv="${a.id}" data-d="-1" ${i ? '' : 'disabled'} aria-label="上移">↑</button><button type="button" class="mv" data-mv="${a.id}" data-d="1" ${i < list.length - 1 ? '' : 'disabled'} aria-label="下移">↓</button></div>`).join('')}</div>`;
  }).join('');
  openSheet(`<div class="sheethead"><h2>帳戶排序與隱藏</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
    <div class="form"><p class="hint" style="margin:0">用箭頭調整同一組裡的順序；點帳戶名稱可以改名、改類型或隱藏。</p><button class="btn" id="mAdd">＋ 新增帳戶</button>${rows}</div>`, root => {
    $('#mAdd', root).onclick = () => editAccount(null, true);
    $$('[data-edit]', root).forEach(b => b.onclick = () => editAccount(+b.dataset.edit, true));
    $$('[data-mv]', root).forEach(b => b.onclick = async () => {
      const a = acct(+b.dataset.mv);
      try { await reorder('accounts', groupAccts(groupTypes(a.account_type)), a.id, +b.dataset.d); manageAccounts(); refresh(); } catch (e) { fail(e); }
    });
  });
}
function editAccount(id, fromManager = false) {
  const a = id ? acct(id) : null;
  const typeOpts = allGroups().filter(g => g[1].length).map(([name, types]) => `<optgroup label="${name}">${types.map(t => `<option value="${t}" ${(a?.account_type || 'bank') === t ? 'selected' : ''}>${TYPE_LABEL[t] || t}</option>`).join('')}</optgroup>`).join('');
  const curs = CURRENCIES.includes(a?.currency || 'TWD') ? CURRENCIES : [a.currency, ...CURRENCIES];

    // 期初餘額：新帳戶直接填；既有帳戶只有 0～1 筆期初紀錄時可在這裡改

        <div class="field"><label for="obd">期初日期</label><input id="obd" type="date" value="${when}"></div></div>
        <p class="hint" style="margin:0">${isLiabType($('#at', root).value) ? '信用卡、應付款項填「目前欠多少」，用正數即可。' : '開始記帳那天帳戶裡的金額。'}${a ? '　要對帳現在的餘額請用<button type="button" class="linkbtn" id="toRec">盤點</button>。' : ''}</p>`;
      const tr = $('#toRec', root); if (tr) tr.onclick = () => reconcile();
    };

    if (!a) drawOb();
    else {
      const r = await sb.from('transactions').select('id,amount,occurred_at').eq('ledger_id', S.ledger.id).eq('account_id', a.id).eq('kind', 'opening_balance').order('occurred_at');
      if (!r.error) {
        if (r.data.length > 1) { obEditable = false; $('#obox', root).innerHTML = `<p class="hint">這個帳戶有 ${r.data.length} 筆期初餘額紀錄（合計 ${money(r.data.reduce((s, x) => s + +x.amount, 0), a.currency)}），請在帳戶明細裡個別修改，或用<button type="button" class="linkbtn" id="toRec2">盤點</button>對帳。</p>`; $('#toRec2', root).onclick = () => reconcile(); }
        else { ob = r.data[0] || null; drawOb(); }

      e.preventDefault();
      const name = $('#an', root).value.trim(); if (!name) return err('請輸入名稱。');
      const t = $('#at', root).value;
      const row = { name, account_type: t, nature: natureOf(t), currency: $('#ac', root).value, memo: $('#am', root).value.trim() || null };
      if (a) row.hidden = $('#ah', root).checked;
      if (!a || groupTypes(a.account_type) !== groupTypes(t)) row.sort_order = nextSort(groupAccts(groupTypes(t)));
      let obAmt = null, obWhen = null;
      if (obEditable && $('#ob', root)) {
        const raw = $('#ob', root).value.replace(/,/g, '').trim();
        if (raw !== '') { const n = parseFloat(raw); if (!isFinite(n)) return err('期初金額格式不對。'); obAmt = n * (isLiabType(t) ? -1 : 1); }
        const d = $('#obd', root).value; obWhen = d ? new Date(d + 'T00:00') : new Date();
        if (isNaN(obWhen)) return err('期初日期格式不對。');
      }
      const r = a ? await sb.from('accounts').update(row).eq('id', a.id) : await sb.from('accounts').insert({ ...row, ledger_id: S.ledger.id }).select().single();
      if (r.error) return err(r.error.message);
      const accId = a ? a.id : r.data.id;
      if (obEditable) {
        let q = null;
        if (ob && (obAmt === null || obAmt === 0)) q = sb.from('transactions').delete().eq('id', ob.id);
        else if (ob) q = sb.from('transactions').update({ amount: obAmt, occurred_at: obWhen.toISOString() }).eq('id', ob.id);
        else if (obAmt) q = sb.from('transactions').insert({ ledger_id: S.ledger.id, kind: 'opening_balance', account_id: accId, amount: obAmt, occurred_at: obWhen.toISOString(), memo: '期初餘額' });
        if (q) { const x = await q; if (x.error) return err('帳戶已儲存，但期初餘額沒存成功：' + x.error.message); }
      }
      toast(a ? '已更新帳戶' : '已新增帳戶'); await after();
    };
    const del = $('#adel', root);
    if (del) del.onclick = async () => {
      if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = '再按一次刪除'; return; }
      const r = await sb.from('accounts').delete().eq('id', a.id);
      if (r.error) { delete del.dataset.armed; del.textContent = '刪除'; return err(r.error.code === '23503' ? '這個帳戶有交易紀錄，不能刪除。可以改成勾選「隱藏」。' : r.error.message); }
      toast('已刪除帳戶'); await after();
    };
  });
}

function cpSummary() {
  const per = new Map();
  for (const r of S.cpBal) { if (!r.currency) continue; const m = per.get(r.id) || {}; m[r.currency] = Number(r.balance); per.set(r.id, m); }
  return per;
}
async function viewLoans() {

  const open = [], settled = [];
  for (const c of S.cps) {
    if (c.hidden) continue;
    const m = per.get(c.id) || {}; const nonzero = Object.entries(m).filter(([, b]) => Math.abs(b) >= 0.005);

    .or(`account_id.in.(${debtIds}),to_account_id.in.(${debtIds})`).order('occurred_at', { ascending: false }).limit(300);

  bindRows(box, r.data);
}

  S.cps.push(data); S.cpMap.set(data.id, data); return data.id;

/* ---------- 損益表 ---------- */
async function viewReport() {
  const v = $('#view'), L = S.ledger.id, m = S.month, yearMode = S.rp === 'year';
  const pStart = yearMode ? new Date(m.getFullYear(), 0, 1) : m, pEnd = yearMode ? new Date(m.getFullYear() + 1, 0, 1) : addMonths(m, 1);
  const tStart = yearMode ? pStart : addMonths(m, -11), tEnd = yearMode ? pEnd : addMonths(m, 1);
  const label = yearMode ? `${m.getFullYear()} 年` : `${m.getFullYear()} 年 ${m.getMonth() + 1} 月`;
  v.innerHTML = `<div class="seg" role="group"><button data-p="month" aria-pressed="${!yearMode}">月</button><button data-p="year" aria-pressed="${yearMode}">年</button></div>
    <div class="card"><div class="monthbar"><button id="prev" aria-label="上一期">‹</button><strong>${label}</strong><button id="next" aria-label="下一期">›</button></div></div>
    <div class="card" id="stmt"><div class="spinner">計算中…</div></div>
    <div class="sectionhead"><h2>${yearMode ? '各月收支' : '近 12 個月'}</h2><span class="hint">台幣帳戶</span></div>
    <div class="card" id="trend"><div class="spinner">計算中…</div></div>`;
  $$('[data-p]', v).forEach(b => b.onclick = () => { S.rp = b.dataset.p; viewReport(); });
  $('#prev').onclick = () => { S.month = yearMode ? new Date(m.getFullYear() - 1, m.getMonth(), 1) : addMonths(m, -1); viewReport(); };
  $('#next').onclick = () => { S.month = yearMode ? new Date(m.getFullYear() + 1, m.getMonth(), 1) : addMonths(m, 1); viewReport(); };
  const [rows, sells] = await Promise.all([
    fetchAll(() => sb.from('transactions').select('kind,occurred_at,account_id,amount,category_id').eq('ledger_id', L)
      .in('kind', ['expense', 'income']).gte('occurred_at', tStart.toISOString()).lt('occurred_at', tEnd.toISOString()).order('id')),
    fetchAll(() => sb.from('transactions').select('occurred_at,account_id,amount,to_amount').eq('ledger_id', L)
      .eq('trade_side', 'sell').gte('occurred_at', tStart.toISOString()).lt('occurred_at', tEnd.toISOString()).order('id')),
  ]);
  const tw = id => (acct(id)?.currency || 'TWD') === 'TWD';
  const inP = t => { const d = new Date(t.occurred_at); return d >= pStart && d < pEnd; };
  const pRows = rows.filter(t => tw(t.account_id) && inP(t));
  const realized = sells.filter(t => tw(t.account_id) && inP(t)).reduce((s, t) => s + ((t.to_amount ?? t.amount) - t.amount), 0);
  // 依第一層分類加總，保留子分類明細
  const tree = kind => {
    const top = new Map();
    for (const t of pRows.filter(t => t.kind === kind)) {
      const c = S.catMap.get(t.category_id), p = c?.parent_id ? S.catMap.get(c.parent_id) : c;
      const pk = p?.name || '未分類', ck = c && c.parent_id ? c.name : null;
      const e = top.get(pk) || { sum: 0, kids: new Map() }; e.sum += +t.amount;
      if (ck) e.kids.set(ck, (e.kids.get(ck) || 0) + +t.amount);
      top.set(pk, e);
    }
    return [...top].sort((a, b) => b[1].sum - a[1].sum);
  };
  const inc = tree('income'), exp = tree('expense');
  const incTot = inc.reduce((s, x) => s + x[1].sum, 0), expTot = exp.reduce((s, x) => s + x[1].sum, 0);
  const net = incTot + realized - expTot;
  const block = (list, cls) => list.map(([name, e]) => `<div class="st-r"><span>${esc(name)}</span><span class="num ${cls}">${money(e.sum)}</span></div>
    ${[...e.kids].sort((a, b) => b[1] - a[1]).map(([k, x]) => `<div class="st-r st-sub"><span>${esc(k)}</span><span class="num">${money(x)}</span></div>`).join('')}`).join('');
  $('#stmt').innerHTML = `<div class="stmt">
    <div class="st-h">收入</div>${block(inc, '') || '<div class="st-r st-sub"><span>（無）</span><span></span></div>'}
    <div class="st-t"><span>收入合計</span><span class="num inc">${money(incTot)}</span></div>
    <div class="st-h">投資</div>
    <div class="st-r"><span>已實現損益</span><span class="num ${realized >= 0 ? 'inc' : 'exp'}">${money(realized, 'TWD', true)}</span></div>
    <div class="st-h">支出</div>${block(exp, '') || '<div class="st-r st-sub"><span>（無）</span><span></span></div>'}
    <div class="st-t"><span>支出合計</span><span class="num exp">${money(expTot)}</span></div>
    <div class="st-net"><span>本期淨利</span><span class="num ${net >= 0 ? 'inc' : 'exp'}">${money(net, 'TWD', true)}</span></div>
  </div>`;
  // 趨勢
  const months = Array.from({ length: 12 }, (_, i) => addMonths(tStart, i));
  const agg = months.map(mm => { const n = addMonths(mm, 1), r = { e: 0, i: 0 }, w = t => { const d = new Date(t.occurred_at); return d >= mm && d < n; };
    for (const t of rows) if (tw(t.account_id) && w(t)) r[t.kind === 'expense' ? 'e' : 'i'] += +t.amount;
    for (const t of sells) if (tw(t.account_id) && w(t)) r.i += (t.to_amount ?? t.amount) - t.amount;
    return r; });
  const top = Math.max(1, ...agg.flatMap(a => [a.e, a.i]));
  const step = niceStep(top / 4), yMax = Math.ceil(top / step) * step;
  const W = 600, H = 220, pl = 48, pb = 24, pt = 10, cw = (W - pl - 8) / 12, y = val => pt + (H - pt - pb) * (1 - Math.max(0, val) / yMax);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="各月收支">`;
  for (let g = 0; g <= yMax + 1e-9; g += step) svg += `<line x1="${pl}" x2="${W - 4}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(g) + 4}" text-anchor="end">${g >= 1000 ? nf.format(g / 1000) + 'k' : g}</text>`;
  agg.forEach((a, i) => {
    const x = pl + i * cw + cw * 0.15, bw = cw * 0.33;
    svg += `<rect x="${x}" y="${y(a.e)}" width="${bw}" height="${y(0) - y(a.e)}" rx="2" fill="var(--exp)"><title>${months[i].getMonth() + 1} 月支出 ${money(a.e)}</title></rect>`;
    svg += `<rect x="${x + bw + 2}" y="${y(a.i)}" width="${bw}" height="${y(0) - y(a.i)}" rx="2" fill="var(--inc)" opacity=".8"><title>${months[i].getMonth() + 1} 月收入 ${money(a.i)}</title></rect>`;
    svg += `<text x="${pl + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${months[i].getMonth() + 1}月</text>`;
  });
  svg += '</svg>';
  $('#trend').innerHTML = `<div style="overflow-x:auto">${svg}</div><div class="extra"><span class="exp">■</span> 支出　<span class="inc">■</span> 收入（含已實現投資損益）</div>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); for (const k of [1, 2, 5, 10]) if (k * p >= x) return k * p; return 10 * p; }

const catTops = kind => S.cats.filter(c => c.kind === kind && !c.parent_id).sort(bySort);
const catKids = pid => S.cats.filter(c => c.parent_id === pid).sort(bySort);

async function createCategory(kind, name, parentId) {

// 自由分錄 → 資料表欄位
function mapJournal(dr, cr, amt) {
  if (!dr || !cr) return { err: '請選擇借方和貸方。' };
  if (dr === cr) return { err: '借方和貸方不能相同。' };
  const [dt, di] = dr.split(':'), [ct, ci] = cr.split(':'), D = +di, C = +ci;
  const catKind = id => S.catMap.get(id)?.kind;
  if (dt === 'a' && ct === 'a') {
    if (acct(D).currency !== acct(C).currency) return { err: '兩個帳戶幣別不同，請改用「轉帳」分頁填轉入金額。' };
    return { row: { kind: 'transfer', account_id: C, to_account_id: D, amount: amt, to_amount: amt, category_id: null }, desc: `轉帳：${acct(C).name} → ${acct(D).name}` };
  }
  if (dt === 'c' && ct === 'a' && catKind(D) === 'expense') return { row: { kind: 'expense', account_id: C, category_id: D, amount: amt }, desc: '一般支出' };
  if (dt === 'a' && ct === 'c' && catKind(C) === 'income') return { row: { kind: 'income', account_id: D, category_id: C, amount: amt }, desc: '一般收入' };
  if (dt === 'a' && ct === 'c' && catKind(C) === 'expense') return { row: { kind: 'expense', account_id: D, category_id: C, amount: -amt }, desc: '支出沖銷（退款），會減少該分類的支出' };
  if (dt === 'c' && ct === 'a' && catKind(D) === 'income') return { row: { kind: 'income', account_id: C, category_id: D, amount: -amt }, desc: '收入沖回，會減少該分類的收入' };
  return { err: '借方和貸方至少要有一邊是帳戶。' };
}

function openForm({ mode, tx, loanType: lt0, cpId, accountId, side, invId } = {}) {
  const st = { mode: mode || 'expense', amount: '', to_amount: '', when: toLocalInput(new Date()), memo: '', cat: null, acc: null, from: null, to: null,
               lt: lt0 || 'lend', cp: cpId ?? null, my: null, debt: null, dr: '', cr: '',
               side: side || 'buy', inv: invId ?? null, cash: null, qty: '', price: '', fee: '', cost: '', costTouched: false, newInv: '' };
  if (tx) {
    const A = acct(tx.account_id), B = acct(tx.to_account_id), lt = loanType(tx);
    Object.assign(st, { when: toLocalInput(new Date(tx.occurred_at)), memo: tx.memo || '', cp: tx.counterparty_id });
    if (tx.trade_side && tx.kind === 'transfer') {
      const buy = tx.trade_side === 'buy';
      Object.assign(st, { mode: 'invest', side: tx.trade_side, inv: buy ? B.id : A.id, cash: buy ? A.id : B.id, qty: tx.quantity ?? '', price: tx.unit_price ?? '', fee: tx.fee ?? '',
        cost: buy ? '' : tx.amount, costTouched: !buy });
    } else if (tx.trade_side) Object.assign(st, { mode: 'other', acc: A.id, amount: tx.amount });
    else if (lt) { const L = LOAN[lt]; Object.assign(st, { mode: 'loan', lt, my: L.dir === 'out' ? A.id : B.id, debt: L.dir === 'out' ? B.id : A.id,
      amount: L.dir === 'out' ? tx.amount : (tx.to_amount ?? tx.amount), to_amount: L.dir === 'out' ? (tx.to_amount ?? '') : tx.amount }); }
    else if (tx.kind === 'transfer') Object.assign(st, { mode: 'transfer', from: A.id, to: B.id, amount: tx.amount, to_amount: tx.to_amount ?? '' });
    else if ((tx.kind === 'expense' || tx.kind === 'income') && tx.amount < 0) {
      const a = 'a:' + A.id, c = 'c:' + tx.category_id;
      Object.assign(st, { mode: 'journal', amount: -tx.amount, dr: tx.kind === 'expense' ? a : c, cr: tx.kind === 'expense' ? c : a });
    }
    else if (tx.kind === 'expense' || tx.kind === 'income') Object.assign(st, { mode: tx.kind, acc: A.id, cat: tx.category_id, amount: tx.amount });
    else Object.assign(st, { mode: 'other', acc: A.id, amount: tx.amount });
  }
  const last = LS.get('last', {});
  const firstPlain = S.accts.find(a => !isDebt(a) && !isInv(a) && !a.hidden)?.id;
  st.acc ??= accountId ?? last[st.mode] ?? firstPlain;
  st.my ??= last.loan ?? firstPlain;
  st.from ??= last.transfer ?? S.accts.find(a => !a.hidden)?.id;
  st.cash ??= last.invest ?? S.accts.find(a => a.account_type === 'bank' && !a.hidden)?.id ?? firstPlain;
  st.inv ??= S.accts.find(a => isInv(a) && !a.hidden && (S.bal.get(a.id) || 0) > 0)?.id ?? S.accts.find(a => isInv(a) && !a.hidden)?.id ?? '__new';

  const num = v => parseFloat(String(v ?? '').replace(/,/g, ''));
  const avgCost = () => { const p = S.pos.get(+st.inv), c = S.bal.get(+st.inv) || 0; return p && p.shares > 0 ? c / p.shares : null; };
  const calcInv = () => {
    const q = num(st.qty), pr = num(st.price), f = num(st.fee) || 0, gross = (q || 0) * (pr || 0);
    if (st.side === 'buy') return { total: Math.round((gross + f) * 100) / 100 };
    const proceeds = Math.round((gross - f) * 100) / 100;
    const ac = avgCost();
    if (!st.costTouched) st.cost = ac != null && q > 0 ? String(Math.round(ac * q * 100) / 100) : st.cost;
    const cost = num(st.cost);
    return { proceeds, cost, pl: isFinite(cost) ? Math.round((proceeds - cost) * 100) / 100 : null, ac };
  };

  const render = () => {
    const tabs = [['expense', '支出'], ['income', '收入'], ['transfer', '轉帳'], ['invest', '投資'], ['journal', '分錄']];
    if (st.mode === 'loan') tabs.push(['loan', '借貸']);
    let body = '';
    if (st.mode === 'expense' || st.mode === 'income') {
      const a = acct(+st.acc);
      body = `<div class="field"><label for="fcat">分類</label><select id="fcat">${catOptions(st.mode, st.cat, true)}</select></div>
        <div class="two" id="fcatnw" ${st.cat === '__new' ? '' : 'hidden'}><div class="field"><label for="fcatn">新分類名稱</label><input id="fcatn" value="${esc(st.newCat || '')}"></div>
          <div class="field"><label for="fcatp">放在</label><select id="fcatp"><option value="">（作為大分類）</option>${catTops(st.mode).filter(p => !p.hidden).map(p => `<option value="${p.id}" ${p.id === st.newCatP ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
        <div class="field"><label for="facc">帳戶</label><select id="facc">${acctOptions(() => true, +st.acc)}</select></div>
        ${isDebt(a) ? `<div class="field"><label for="fcp">借貸對象（${st.mode === 'expense' ? '誰代付' : '誰'}）</label><select id="fcp">${cpOptions(st.cp)}</select></div><div class="field" id="fcpnw" hidden><label for="fcpn">新對象名字</label><input id="fcpn"></div>` : ''}`;
    } else if (st.mode === 'transfer') {
      const A = acct(+st.from), B = acct(+st.to);
      body = `<div class="two"><div class="field"><label for="ffrom">從（貸方）</label><select id="ffrom">${acctOptions(() => true, +st.from)}</select></div>
        <div class="field"><label for="fto">到（借方）</label><select id="fto"><option value="">（選擇）</option>${acctOptions(() => true, +st.to)}</select></div></div>
        ${A && B && A.currency !== B.currency ? `<div class="field"><label for="fto_amt">轉入金額（${B.currency}）</label><input id="fto_amt" class="num" inputmode="decimal" value="${esc(st.to_amount)}"></div>` : ''}
        ${isInv(B) || isInv(A) ? '<p class="hint">要記股數和損益的話，請用「投資」分頁。</p>' : ''}`;
    } else if (st.mode === 'journal') {
      const m = mapJournal(st.dr, st.cr, 1);
      body = `<p class="hint" style="margin:0">借方是資金的去處或費用，貸方是資金的來源或收入。</p>
        <div class="field"><label for="fdr">借方</label><select id="fdr">${journalOptions(st.dr)}</select></div>
        <div class="field"><label for="fcr">貸方</label><select id="fcr">${journalOptions(st.cr)}</select></div>
        <p class="hint" id="jhint">${st.dr && st.cr ? esc(m.err || '會記成：' + m.desc) : ''}</p>`;
    } else if (st.mode === 'invest') {
      const I = st.inv === '__new' ? null : acct(+st.inv), Cc = acct(+st.cash), c = calcInv(), p = I ? S.pos.get(I.id) : null;
      body = `<div class="seg" role="group"><button type="button" data-side="buy" aria-pressed="${st.side === 'buy'}">買進</button><button type="button" data-side="sell" aria-pressed="${st.side === 'sell'}">賣出</button></div>
        <div class="two"><div class="field"><label for="finv">投資帳戶</label><select id="finv">${acctOptions(isInv, +st.inv)}<option value="__new" ${st.inv === '__new' ? 'selected' : ''}>＋ 新增投資帳戶…</option></select></div>
          <div class="field"><label for="fcash">${st.side === 'buy' ? '付款帳戶' : '入帳帳戶'}</label><select id="fcash">${acctOptions(a => !isInv(a) && !isDebt(a), +st.cash)}</select></div></div>
        ${st.inv === '__new' ? `<div class="field"><label for="fnewinv">新帳戶名稱（例如股票名稱）</label><input id="fnewinv" value="${esc(st.newInv)}" placeholder="例如：台積電 2330"></div>` : ''}
        ${I && p ? `<p class="hint" style="margin:0">目前${p.shares == null ? '股數未記錄' : '持有 ' + qf.format(p.shares) + ' 股'}，成本 ${money(S.bal.get(I.id) || 0, I.currency)}${p.shares > 0 ? '，平均 ' + money((S.bal.get(I.id) || 0) / p.shares, I.currency) : ''}</p>` : ''}
        <div class="two"><div class="field"><label for="fqty">股數</label><input id="fqty" class="num" inputmode="decimal" value="${esc(st.qty)}"></div>
          <div class="field"><label for="fprice">成交價</label><input id="fprice" class="num" inputmode="decimal" value="${esc(st.price)}"></div></div>
        <div class="field"><label for="ffee">${st.side === 'buy' ? '手續費' : '手續費＋交易稅'}</label><input id="ffee" class="num" inputmode="decimal" value="${esc(st.fee)}" placeholder="0"></div>
        ${st.side === 'sell' ? `<div class="field"><label for="fcost">賣出部分的成本</label><input id="fcost" class="num" inputmode="decimal" value="${esc(st.cost)}">
          <span class="hint">${c.ac != null ? `預設用平均成本 ${money(c.ac, I?.currency)} × 股數計算，可自行修改。` : '這個帳戶沒有股數紀錄，請自行填入成本（或先到帳戶裡補登股數）。'}</span></div>` : ''}
        <div class="card" style="box-shadow:none;background:var(--bg);padding:12px" id="invsum"></div>`;
    } else if (st.mode === 'loan') {
      const L = LOAN[st.lt];
      if (!st.debt || acct(+st.debt)?.account_type !== L.debt) st.debt = defaultDebt(L.debt, acct(+st.my)?.currency);
      const M = acct(+st.my), D = acct(+st.debt);
      body = `<div class="seg" role="group">${Object.entries(LOAN).map(([k, x]) => `<button type="button" data-lt="${k}" aria-pressed="${st.lt === k}">${x.label}</button>`).join('')}</div>
        <p class="hint" style="margin:0">${L.note}${L.dir === 'out' ? '，錢從我的帳戶出去' : '，錢進到我的帳戶'}。</p>
        <div class="field"><label for="fcp">對象</label><select id="fcp" required>${cpOptions(st.cp)}</select></div>
        <div class="field" id="fcpnw" hidden><label for="fcpn">新對象名字</label><input id="fcpn" placeholder="例如：Lina"></div>
        <div class="field"><label for="fmy">${L.dir === 'out' ? '付款帳戶' : '收款帳戶'}</label><select id="fmy">${acctOptions(a => !isDebt(a), +st.my)}</select></div>
        <details ${D && M && D.currency !== M.currency ? 'open' : ''}><summary class="hint" style="cursor:pointer">記到哪個${L.debt === 'receivable' ? '應收' : '應付'}帳戶：${esc(D?.name || '（無）')}</summary>
          <div class="field" style="margin-top:8px"><select id="fdebt" aria-label="債權債務帳戶">${acctOptions(a => a.account_type === L.debt, +st.debt)}</select></div></details>
        ${D && M && D.currency !== M.currency ? `<div class="field"><label for="fto_amt">換算後金額（${D.currency}）</label><input id="fto_amt" class="num" inputmode="decimal" value="${esc(st.to_amount)}"></div>` : ''}`;
    } else {
      body = `<div class="field"><label for="facc">帳戶</label><select id="facc" disabled>${acctOptions(() => true, +st.acc)}</select></div><p class="hint">這是${tx.trade_side ? '補登股數' : tx.kind === 'opening_balance' ? '期初餘額' : '餘額調整'}紀錄，只能改${tx.trade_side ? '時間、備註，或刪除後重新補登' : '金額、時間、備註'}。</p>`;
    }
    const showAmt = st.mode !== 'invest' && !(st.mode === 'other' && tx?.trade_side);
    $('#sheetBody').innerHTML = `
      <div class="sheethead"><h2>${tx ? '編輯紀錄' : '記一筆'}</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
      <form class="form" id="txf" novalidate>
        ${st.mode === 'other' ? '' : `<div class="seg tabs5" role="group">${tabs.map(([k, n]) => `<button type="button" data-mode="${k}" aria-pressed="${st.mode === k}">${n}</button>`).join('')}</div>`}
        ${showAmt ? `<div class="field"><label for="famt">金額</label><input id="famt" class="amount" inputmode="decimal" placeholder="0" value="${esc(st.amount)}" autocomplete="off"></div>` : ''}
        ${body}
        <div class="two"><div class="field"><label for="fwhen">時間</label><input id="fwhen" type="datetime-local" value="${st.when}"></div>
          <div class="field"><label for="fmemo">備註</label><input id="fmemo" value="${esc(st.memo)}" placeholder="選填"></div></div>
        <p class="hint" id="ferr" style="color:var(--inc)"></p>
        <div class="formbtns">${tx ? '<button type="button" class="btn danger" id="fdel">刪除</button>' : ''}<button class="btn" type="submit">儲存</button></div>
      </form>`;
    const root = $('#sheetBody');
    $$('[data-close]', root).forEach(b => b.onclick = closeSheet);
    const g = id => $('#' + id, root);
    const grab = () => {
      st.amount = g('famt')?.value ?? st.amount; st.when = g('fwhen')?.value || st.when; st.memo = g('fmemo')?.value ?? st.memo;
      if (g('fcat')) st.cat = g('fcat').value === '__new' ? '__new' : +g('fcat').value; if (g('facc')) st.acc = +g('facc').value;
      if (g('fcatn')) { st.newCat = g('fcatn').value; st.newCatP = +g('fcatp').value || null; }
      if (g('ffrom')) st.from = +g('ffrom').value; if (g('fto')) st.to = +g('fto').value || null;
      if (g('fmy')) st.my = +g('fmy').value; if (g('fdebt')) st.debt = +g('fdebt').value;
      if (g('fto_amt')) st.to_amount = g('fto_amt').value;
      if (g('fcp') && g('fcp').value && g('fcp').value !== '__new') st.cp = +g('fcp').value;
      if (g('fdr')) st.dr = g('fdr').value; if (g('fcr')) st.cr = g('fcr').value;
      if (g('finv')) st.inv = g('finv').value === '__new' ? '__new' : +g('finv').value;
      if (g('fcash')) st.cash = +g('fcash').value; if (g('fnewinv')) st.newInv = g('fnewinv').value;
      if (g('fqty')) st.qty = g('fqty').value; if (g('fprice')) st.price = g('fprice').value; if (g('ffee')) st.fee = g('ffee').value;
      if (g('fcost')) st.cost = g('fcost').value;
    };
    const updInv = () => {
      const box = g('invsum'); if (!box) return;
      const c = calcInv(), cur = acct(+st.cash)?.currency || 'TWD';
      if (g('fcost') && !st.costTouched) g('fcost').value = st.cost;
      box.innerHTML = st.side === 'buy'
        ? `<div style="display:flex;justify-content:space-between"><span>付款金額</span><span class="num">${money(c.total, cur)}</span></div><div class="hint">借 投資帳戶　貸 ${esc(acct(+st.cash)?.name || '')}</div>`
        : `<div style="display:flex;justify-content:space-between"><span>實收金額</span><span class="num">${money(c.proceeds, cur)}</span></div>
           <div style="display:flex;justify-content:space-between"><span>已實現損益</span><span class="num ${c.pl >= 0 ? 'inc' : 'exp'}">${c.pl == null ? '—' : money(c.pl, cur, true)}</span></div>
           <div class="hint">借 ${esc(acct(+st.cash)?.name || '')} ${c.proceeds ? money(c.proceeds, cur) : ''}　貸 投資帳戶 ${isFinite(c.cost) ? money(c.cost, cur) : ''}　差額記為投資損益</div>`;
    };
    $$('[data-mode]', root).forEach(b => b.onclick = () => {
      grab(); const to = b.dataset.mode;
      if (to === 'journal' && st.mode !== 'journal') { // 把目前填的內容帶進分錄
        if (st.mode === 'expense' && st.cat) { st.dr = 'c:' + st.cat; st.cr = 'a:' + st.acc; }
        else if (st.mode === 'income' && st.cat) { st.dr = 'a:' + st.acc; st.cr = 'c:' + st.cat; }
        else if (st.mode === 'transfer' && st.to) { st.dr = 'a:' + st.to; st.cr = 'a:' + st.from; }
      }
      if (to !== st.mode && (to === 'expense' || to === 'income')) st.cat = null;
      st.mode = to; render();
    });
    $$('[data-lt]', root).forEach(b => b.onclick = () => { grab(); st.lt = b.dataset.lt; render(); });
    $$('[data-side]', root).forEach(b => b.onclick = () => { grab(); st.side = b.dataset.side; st.costTouched = false; st.cost = ''; render(); });
    ['facc', 'ffrom', 'fto', 'fmy', 'fdebt', 'fdr', 'fcr', 'finv', 'fcash'].forEach(id => { const el = g(id); if (el) el.onchange = () => { grab(); if (id === 'finv') { st.costTouched = false; st.cost = ''; } render(); }; });
    ['fqty', 'fprice', 'ffee'].forEach(id => { const el = g(id); if (el) el.oninput = () => { grab(); updInv(); }; });
    if (g('fcost')) g('fcost').oninput = () => { grab(); st.costTouched = true; updInv(); };
    updInv();
    const cpSel = g('fcp');
    if (cpSel) { const s = () => g('fcpnw').hidden = cpSel.value !== '__new'; cpSel.addEventListener('change', s); s(); }
    if (g('fcat')) g('fcat').onchange = () => { g('fcatnw').hidden = g('fcat').value !== '__new'; if (g('fcat').value === '__new') g('fcatn').focus(); };
    if (!tx) setTimeout(() => (g('famt') || g('fqty'))?.focus(), 220);
    const del = g('fdel');
    if (del) del.onclick = async () => {
      if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = '再按一次刪除'; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = '刪除'; } }, 3000); return; }
      const { error } = await sb.from('transactions').delete().eq('id', tx.id);
      if (error) return fail(error); closeSheet(); toast('已刪除'); await reloadAll();
    };
    g('txf').onsubmit = async e => {
      e.preventDefault(); grab();
      const err = m => { g('ferr').textContent = m; };
      const amt = num(st.amount);
      const when = new Date(st.when); if (isNaN(when)) return err('時間格式不對。');
      const row = { occurred_at: when.toISOString(), memo: st.memo.trim() || null };
      if (showAmt && st.mode !== 'other' && !(amt > 0)) return err('請輸入大於 0 的金額。');
      if (st.mode === 'other' && showAmt && !isFinite(amt)) return err('請輸入金額。');
      const toAmt = st.to_amount === '' ? null : num(st.to_amount);
      try {
        if (st.mode === 'expense' || st.mode === 'income') {
          if (!st.cat) return err('請選分類。');
          if (st.cat === '__new') st.cat = await createCategory(st.mode, st.newCat, st.newCatP);
          Object.assign(row, { kind: st.mode, account_id: +st.acc, to_account_id: null, to_amount: null, amount: amt, category_id: +st.cat });
          row.counterparty_id = isDebt(acct(+st.acc)) && cpSel ? (cpSel.value ? await resolvePerson(cpSel.value, g('fcpn')?.value) : null) : null;
        } else if (st.mode === 'transfer') {
          if (!st.to) return err('請選轉入帳戶。'); if (+st.from === +st.to) return err('轉出和轉入不能是同一個帳戶。');
          const diff = acct(+st.from).currency !== acct(+st.to).currency;
          if (diff && !(toAmt > 0)) return err('兩個帳戶幣別不同，請填轉入金額。');
          Object.assign(row, { kind: 'transfer', account_id: +st.from, to_account_id: +st.to, amount: amt, to_amount: diff ? toAmt : amt, category_id: null });
        } else if (st.mode === 'journal') {
          const m = mapJournal(st.dr, st.cr, amt); if (m.err) return err(m.err);
          Object.assign(row, { to_account_id: null, to_amount: null, counterparty_id: null }, m.row);
        } else if (st.mode === 'invest') {
          const q = num(st.qty), pr = num(st.price), f = num(st.fee) || 0, c = calcInv();
          if (!(q > 0)) return err('請輸入股數。'); if (!(pr >= 0) || !isFinite(pr)) return err('請輸入成交價。'); if (f < 0) return err('手續費不能是負數。');
          let invAcct = st.inv === '__new' ? null : acct(+st.inv); const cash = acct(+st.cash);
          if (!cash) return err('請選資金帳戶。');
          if (!invAcct) {
            const name = (st.newInv || '').trim(); if (!name) return err('請輸入新投資帳戶的名稱。');
            if (st.side === 'sell') return err('新帳戶還沒有持股，不能賣出。');
            const r = await sb.from('accounts').insert({ ledger_id: S.ledger.id, name, account_type: 'stock', nature: 'asset', currency: cash.currency, sort_order: nextSort(groupAccts(groupTypes('stock'))) }).select().single();
            if (r.error) throw r.error; invAcct = r.data; S.accts.push(invAcct); S.acctMap.set(invAcct.id, invAcct); st.inv = invAcct.id;
          }
          if (invAcct.currency !== cash.currency) return err(`投資帳戶是 ${invAcct.currency}，資金帳戶是 ${cash.currency}，請選同幣別的帳戶。`);
          const base = { kind: 'transfer', category_id: null, counterparty_id: null, quantity: q, unit_price: pr, fee: f || null, trade_side: st.side };
          if (st.side === 'buy') Object.assign(row, base, { account_id: cash.id, to_account_id: invAcct.id, amount: c.total, to_amount: c.total });
          else {
            const p = S.pos.get(invAcct.id), own = tx?.trade_side === 'sell' ? (+tx.quantity || 0) : 0;
            if (p && p.shares != null && q > p.shares + own + 1e-9) return err(`賣出股數超過目前持有的 ${qf.format(p.shares + own)} 股。`);
            if (!(c.cost >= 0)) return err('請填賣出部分的成本。');
            if (c.proceeds < 0) return err('費用比成交金額還高，請檢查數字。');
            Object.assign(row, base, { account_id: invAcct.id, to_account_id: cash.id, amount: c.cost, to_amount: c.proceeds });
          }
        } else if (st.mode === 'loan') {
          const L = LOAN[st.lt];
          if (!cpSel.value) return err('請選擇借貸對象。');
          if (!st.debt) return err(`帳本裡還沒有${L.debt === 'receivable' ? '應收' : '應付'}款項帳戶。`);
          const cp = await resolvePerson(cpSel.value, g('fcpn')?.value);
          const M = acct(+st.my), D = acct(+st.debt), diff = M.currency !== D.currency;
          if (diff && !(toAmt > 0)) return err('兩個帳戶幣別不同，請填換算後金額。');
          const debtAmt = diff ? toAmt : amt;
          Object.assign(row, { kind: 'transfer', category_id: null, counterparty_id: cp },
            L.dir === 'out' ? { account_id: M.id, to_account_id: D.id, amount: amt, to_amount: debtAmt }
                            : { account_id: D.id, to_account_id: M.id, amount: debtAmt, to_amount: amt });
        } else if (showAmt) {
          Object.assign(row, { amount: amt });
        }
        if (st.mode !== 'invest' && st.mode !== 'other') Object.assign(row, { quantity: null, unit_price: null, fee: null, trade_side: null });
        const r = tx ? await sb.from('transactions').update(row).eq('id', tx.id) : await sb.from('transactions').insert({ ...row, ledger_id: S.ledger.id });
        if (r.error) throw r.error;
        const last = LS.get('last', {});
        if (st.mode === 'loan') last.loan = +st.my; else if (st.mode === 'transfer') last.transfer = +st.from; else if (st.mode === 'invest') last.invest = +st.cash;
        else if (st.mode === 'expense' || st.mode === 'income') last[st.mode] = +st.acc;
        LS.set('last', last);
        closeSheet(); toast(tx ? '已更新' : st.mode === 'invest' && st.side === 'sell' ? `已記下，損益 ${money(calcInv().pl, acct(+st.cash)?.currency, true)}` : '已記下'); await reloadAll();
      } catch (er) { err(er.message || String(er)); }
    };
  };
  const s = $('#sheet'); s.hidden = false; requestAnimationFrame(() => s.classList.add('open'));
  render();
}

/* ---------- boot ---------- */
let booted = null;
function startDemo(empty = false) { DEMO = true; sb = makeDemo(empty === true); booted = null; S.ledger = null; onSession(sb.session); }
function exitDemo() { DEMO = false; sb = real; booted = null; S.user = null; renderLogin(); }
async function reachable() {
  if (!real) return false;
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
    const r = await fetch(SB_URL + '/auth/v1/health', { headers: { apikey: SB_KEY }, signal: c.signal });
    clearTimeout(t); return r.status < 500;
  } catch { return false; }
}
async function onSession(session) {
  if (!session) { S.user = null; booted = null; renderLogin(); return; }
  if (booted === session.user.id) return;
  booted = session.user.id; S.user = session.user;
  $('#app').innerHTML = '<div class="spinner">載入帳本…</div>';
  try { await ensureLedger(); LS.set('ledger', S.ledger.id); await loadRef(); renderShell(); }
  catch (e) { fail(e); $('#app').innerHTML = `<div class="login"><h1>載入失敗</h1><p>${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">重試</button></div>`; }
}
(async function boot() {
  if (location.hash === '#demo') return startDemo(false);
  if (location.hash === '#demo-empty') return startDemo(true);
  OFFLINE = !(await reachable());
  if (OFFLINE) return renderLogin();
  real.auth.onAuthStateChange((_ev, session) => { if (!DEMO) setTimeout(() => onSession(session), 0); });
  const { data } = await real.auth.getSession();
  if (!DEMO) onSession(data.session);
})();
</script>
</body>
