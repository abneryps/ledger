<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a4d8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳本">
<title>蝦蝦記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: 手機優先的單頁 App — 上方標題列、中間內容、下方分頁列＋記一筆按鈕、從下方滑出的表單 */
:root{
  /* 淺色：海軍藍 #3F679B／鋼藍 #74A2BC／霧綠 #CBDEDC／米白 #F2EFE8 */
  --bg:#F2EFE8; --surface:#FFFFFF; --ink:#1C2A3A; --muted:#5C6773; --line:#E1E3DD;
  --accent:#3F679B; --accent-ink:#FFFFFF; --accent-soft:#E3EEEC;
  --exp:#2F6E54; --inc:#B8433A; --loan:#8A5A1E; --loan-soft:#F5EBDB;
  --steel:#74A2BC; --sage:#CBDEDC;
  --shadow:0 1px 2px rgba(28,42,58,.05),0 6px 18px rgba(28,42,58,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1b1e26; --ink:#e8eaf0; --muted:#9aa1b0; --line:#2b303b;
  --accent:#8aa8ec; --accent-ink:#0f1730; --accent-soft:#232c42;
  --exp:#5cc48a; --inc:#ef7b72; --loan:#e3a95a; --loan-soft:#2e2618;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --ink:#e8eaf0; --muted:#9aa1b0; --line:#2b303b;
  --accent:#8aa8ec; --accent-ink:#0f1730; --accent-soft:#232c42;
  --exp:#5cc48a; --inc:#ef7b72; --loan:#e3a95a; --loan-soft:#2e2618;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--exp)} .inc{color:var(--inc)} .loan{color:var(--loan)} .muted{color:var(--muted)}

/* shell */
#app{max-width:640px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:700;text-wrap:balance}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--accent)}
main{padding-inline:16px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;max-width:640px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;margin-top:-22px;box-shadow:0 6px 16px rgba(42,77,143,.35);gap:0}
nav.tabs .fab span{font-size:24px;line-height:1}
nav.tabs button.deskonly{display:none}

/* blocks */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar button{border:0;background:none;font-size:22px;color:var(--accent);width:40px;height:40px;border-radius:50%}
.monthbar strong{font-size:17px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.summary .num{font-size:18px;overflow-wrap:anywhere}
.extra{font-size:12px;color:var(--muted);margin-top:8px}
.cpick{display:flex;flex-direction:column;gap:8px}
.cpick-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cpick-cur{flex:1 1 140px;min-width:0;font-size:14px;color:var(--muted)}.cpick-cur strong{color:var(--ink)}
.cpick-top input{flex:1 1 120px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);font-size:16px}
.cpick-res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px}
.cpick-res button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;font:inherit;color:var(--ink);cursor:pointer}
.cpick-res button:hover{background:var(--accent-soft)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid button,.cchips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 4px;font:inherit;font-size:14px;cursor:pointer}
.cgrid button.has{border-color:var(--accent);color:var(--accent);font-weight:700}
.cgrid button.on{background:var(--accent-soft);border-color:var(--accent)}
.cgrid .cnew{color:var(--muted);border-style:dashed}
.cchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--accent-soft);border-radius:12px}
.cchips button{padding:8px 12px}
.cchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.search{display:flex;gap:8px}
.sugbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;max-height:50vh;overflow:auto;margin-top:-4px}
.sugh{font-size:12px;color:var(--muted);padding:6px 8px 2px}
.sugi{text-align:left;background:none;border:0;font:inherit;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer}
.sugi:hover,.sugi:focus{background:var(--accent-soft)}
.sugq{border-top:1px solid var(--line);margin-top:4px;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
.search .btn{flex:none}
.daygroup{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 4px}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row .dot{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.dot.exp{background:color-mix(in srgb,var(--exp) 14%,transparent)}
.dot.inc{background:color-mix(in srgb,var(--inc) 14%,transparent)}
.dot.loan{background:var(--loan-soft)}
.dot.tr{background:var(--accent-soft);color:var(--accent)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{flex:none;text-align:right;font-size:15px}
.row .amt small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.sectionhead h2{font-size:14px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.06em}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.loan{background:var(--loan-soft);color:var(--loan)}
.actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions4 button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.actions4 button small{font-weight:400;color:var(--muted);font-size:11px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--inc);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--exp)}
.bar .fill.inc{background:var(--inc)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cursel{width:auto;min-width:92px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;padding:0 12px;font-size:15px}
.cursel.fx{background:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bigtotal{font-size:28px;line-height:1.2}

.stmt{display:flex;flex-direction:column}
.st-h{font-size:12.5px;color:var(--muted);letter-spacing:.08em;padding:14px 0 4px;border-bottom:1px solid var(--line)}
.st-h:first-child{padding-top:0}
.st-r,.st-t,.st-net{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.st-r span:first-child,.st-t span:first-child{min-width:0;overflow-wrap:anywhere}
.st-sub{padding:3px 0 3px 1.2em;font-size:13px;color:var(--muted)}
.st-t{border-top:1px solid var(--line);font-weight:700}
.st-net{border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:700;font-size:17px}
.tabs5 button{font-size:13.5px;padding:8px 0;min-width:0;white-space:nowrap}
@media (max-width:360px){.tabs5 button{font-size:12.5px}}
.mrow{gap:6px;padding:6px 8px 6px 4px}
.mrow.sub{padding-left:22px}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px}
.mmain .t,.mmain .s{max-width:100%}
.ordin{flex:none;width:3.2em;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font-family:var(--f-num);font-size:16px;color:var(--ink);padding:0}
.ordin:focus{border-color:var(--accent);background:var(--surface)}
body.sorting{user-select:none;-webkit-user-select:none;cursor:grabbing}
.catblock.sorters{display:flex;gap:12px;font-size:12.5px}
.mv{flex:none;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--accent);font-size:16px}
.mv:disabled{opacity:.3;cursor:default}
.ishidden .t{color:var(--muted);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;background:var(--bg);border-radius:12px;padding:14px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.stat .num{font-size:15.5px;overflow-wrap:anywhere}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.posttag{display:block;color:var(--accent)}
.pickwrap{position:relative;display:inline-flex;align-items:center;cursor:pointer}.pickwrap .caret{font-size:.7em;color:var(--muted)}
.pickwrap input,.pickwrap select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
.ledgerchip{border:0;font:inherit;font-size:12px;cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recurbanner{display:block;width:100%;text-align:left;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);font:inherit;cursor:pointer;margin-bottom:12px}
.wdays{display:flex;gap:6px;flex-wrap:wrap}.wdays label{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.dailybal tr[data-day]{cursor:pointer}.dailybal tr.quiet td{color:var(--muted)}.dailybal tr.sel td{background:var(--accent-soft, rgba(43,80,150,.1))}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:8px 7px;background:var(--bg);white-space:nowrap}
.tbl td{text-align:right;padding:9px 7px;border-top:1px solid var(--line);font-family:var(--f-num);vertical-align:top;letter-spacing:-.02em}
.tbl td .chip{margin-top:3px;font-size:11px}
@media (max-width:420px){.tbl{font-size:12px}.tbl td,.tbl th{padding-inline:5px}}
.tbl td small{font-family:var(--f-body)}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap}
.tbl td:first-child{font-family:var(--f-body)}
.tbl tbody tr[data-tx]{cursor:pointer}
.tbl tbody tr[data-tx]:hover{background:var(--accent-soft)}
.tbl tr.done td{color:var(--muted)}
.tbl tr.pool td{background:var(--loan-soft)}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--bg)}
.backbtn{font-size:22px;line-height:1}
.defbtn{font-size:12px;margin-left:6px;letter-spacing:0}
.defmark{font-size:11px;margin-left:6px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:0 7px;letter-spacing:0}
.field label{display:flex;align-items:center;flex-wrap:wrap}
.rangebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rangebar select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:16px;min-height:42px}
.rangedates{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rangedates input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:15px;min-height:42px}
@media (max-width:420px){.rangedates{flex-basis:100%}}
.splittoggle{font-size:14px;color:var(--ink)}
.splitcard{box-shadow:none;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px}
.splitcard select,.splitcard input{background:var(--surface)}
.recrow{gap:12px;cursor:text}
.recrow input{flex:none;width:9.5em;max-width:45%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);text-align:right}
.addsub{color:var(--accent);font-size:13.5px;padding:10px 14px 10px 32px}
/* 分類佔比圓環圖 */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#6250d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9}
.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pie svg{width:150px;height:150px;flex:none}
.pie svg circle.seg{fill:none;stroke-width:22;cursor:pointer;transition:stroke-width .12s}
.pie svg circle.seg.on{stroke-width:28}
.pie svg text{fill:var(--ink);font-family:var(--f-body)}
.pie svg text.pc{font-size:20px;font-weight:700;font-family:var(--f-num)}
.pie svg text.pl{font-size:11px;fill:var(--muted)}
.pielg{flex:1;min-width:200px;display:flex;flex-direction:column}
.pielg button{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;border:0;background:none;padding:7px 6px;border-radius:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.pielg button.on,.pielg button:hover{background:var(--accent-soft)}
.pielg i{width:10px;height:10px;border-radius:3px}
.pielg .pp{font-family:var(--f-num);font-weight:700;min-width:3.4em;text-align:right}
.pielg .pa{font-family:var(--f-num);color:var(--muted);font-size:13px;min-width:5.5em;text-align:right}
.pielg .kids{padding:0 6px 6px 26px;font-size:13px;color:var(--muted)}
.pielg .kids div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
/* 清單左側日期欄 */
.dcol{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border-right:1px solid var(--line);margin-right:2px;padding-right:8px;align-self:stretch}
.dcol .dmd{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--ink)}
.dcol .dyw{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dcol .dsame{color:var(--muted);font-size:13px}
@media (max-width:420px){.dcol{width:58px;padding-right:6px}.dcol .dmd{font-size:15.5px}.dcol .dyw{font-size:10.5px}}
/* 設定頁 */
.setlist{display:flex;flex-direction:column;gap:16px}
.setgrp h3{margin:0 4px 6px;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.setcard{background:var(--bg);border-radius:14px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow:hover{background:var(--accent-soft)}
.setrow svg{width:22px;height:22px;flex:none;color:var(--accent)}
.setx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sett{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setd{font-size:12.5px;color:var(--muted)}
.setgo{color:var(--muted);font-size:20px;line-height:1}
.setfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;flex-wrap:wrap}
/* 常用摘要 */
.deskonly-btn{display:none!important}
@media (min-width:1024px){.deskonly-btn{display:flex!important}}
.memochips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tplchip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.tplchip:hover{border-color:var(--accent);color:var(--accent)}
/* sheet */
.fmore{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fmore summary{cursor:pointer;font-size:14px;color:var(--ink)}
.fmore summary small{margin-left:6px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
#sheet.open{opacity:1}
#sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .2s}
#sheet.open .panel{transform:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheethead h2{font-size:18px;margin:0}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.field input,.field select{min-height:46px;font-size:16px}
/* iOS Safari 的日期欄位有自己的寬度與置中樣式，改成和其他欄位一致 */
input[type="date"],input[type="datetime-local"]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;text-align:left;line-height:1.4}
input[type="date"]::-webkit-date-and-time-value,input[type="datetime-local"]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"]::-webkit-datetime-edit,input[type="datetime-local"]::-webkit-datetime-edit{padding:0}
.field input.amount{font-family:var(--f-num);font-size:28px;padding:8px 12px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.formbtns{display:flex;gap:10px}
.formbtns .btn{flex:1}
.selbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;justify-content:center;padding-inline:16px}
.selbar div{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:608px;width:100%}
.selbar div span{flex:1;white-space:nowrap}
.selbar div>*{white-space:nowrap;flex-shrink:0}
.selbar div{flex-wrap:wrap;row-gap:8px}
.selbar .btn{background:var(--accent);color:var(--accent-ink)}

/* login */
.login{max-width:380px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 16px 32px;display:flex;flex-direction:column;gap:18px}
.login h1{font-size:28px;margin:0}
.login p{margin:0;color:var(--muted)}
.toastbtn{margin-left:10px;background:none;border:0;color:var(--accent-soft);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spinner{padding:40px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* ===== 桌機版（螢幕寬 1024px 以上才生效，手機不受影響） ===== */
@media (min-width:1024px){
  :root{--side:220px;--dock:min(680px,46vw)}
  #app:has(> nav.tabs){max-width:none;margin:0 0 0 var(--side);padding-bottom:40px;transition:margin-right .2s}
  body.sheet-on #app{margin-right:var(--dock)}
  header.top{padding:18px 32px 12px}
  header.top h1{font-size:24px}
  main{padding-inline:32px;max-width:1180px}
  /* 左側導覽 */
  nav.tabs{top:0;bottom:0;right:auto;width:var(--side);max-width:none;margin:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:20px 14px;border-top:0;border-right:1px solid var(--line)}
  nav.tabs::before{content:"蝦蝦記帳";order:-2;font-weight:700;font-size:18px;padding:4px 12px 14px;color:var(--ink)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:15px}
  nav.tabs button:hover{background:var(--accent-soft)}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  nav.tabs .fab{order:-1;width:100%;height:48px;margin:0 0 14px;border-radius:12px;flex-direction:row;justify-content:center;gap:8px;font-size:15px;box-shadow:0 4px 12px rgba(42,77,143,.25)}
  nav.tabs .fab:hover{background:var(--accent);filter:brightness(1.08)}
  nav.tabs .fab span{font-size:20px}
  nav.tabs button.deskonly{display:flex}
  nav.tabs button.deskonly:first-of-type{margin-top:10px}
  .selbar{left:var(--side);bottom:24px}
  body.sheet-on .selbar{right:var(--dock)}
  .selbar div{max-width:760px}
  .selbar [hidden]{display:none}
  /* 右側面板：明細和表單停靠在右邊，左邊畫面照常可以操作 */
  #sheet{inset:0 0 0 auto;width:var(--dock);background:none;align-items:stretch;justify-content:stretch}
  #sheet .panel{max-width:none;max-height:none;height:100%;border-radius:0;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);padding:20px 24px 28px;transform:translateX(24px)}
  .ledgerchip{max-width:260px}
  .mmain:hover,.tbl tbody tr[data-tx]:hover{background:var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){#sheet,#sheet .panel,#app{transition:none}}
/* 彈出視窗開著時，後面的頁面不能捲動（用事件攔截，不改 overflow，避免頁面跳回頂端） */
#sheet{overscroll-behavior:contain}
.tblwrap,[style*="overflow-x:auto"]{overscroll-behavior-x:contain}

/* ===== 淺色模式細節（深色模式不套用） ===== */
@media not all and (prefers-color-scheme:dark){
  :root:not([data-theme="dark"]) .num{font-weight:600}
  :root:not([data-theme="dark"]) .row .dot{background:var(--accent-soft);color:var(--accent)}
  :root:not([data-theme="dark"]) .seg{background:#E0E8E4}
  :root:not([data-theme="dark"]) .recurbanner{background:#E4EDEA;border-color:#A9C6D3}
  :root:not([data-theme="dark"]) nav.tabs{background:#EAE6DD;border-top-color:#DDD8CC}
}
@media (min-width:1024px) and (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) nav.tabs{background:#EAE6DD;border-right-color:#DDD8CC}
  :root:not([data-theme="dark"]) #sheet .panel{background:#F8F6F1}
  :root:not([data-theme="dark"]) nav.tabs button[aria-current="page"]{background:var(--sage);color:var(--ink)}
  :root:not([data-theme="dark"]) nav.tabs::before{color:var(--accent)}
}
:root[data-theme="light"] .num{font-weight:600}
</style>

}
// 這筆交易對某帳戶餘額的影響
function deltaFor(t, accountId) {
  let d = 0;
  if (t.account_id === accountId) d += (t.kind === 'expense' || t.kind === 'transfer') ? -t.amount : +t.amount;
  if (t.kind === 'transfer' && t.to_account_id === accountId) d += +(t.to_amount ?? t.amount);
  return d;
}
// 這筆交易對借貸對象餘額的影響（正 = 對方欠我）
function personDelta(t) {
  const A = acct(t.account_id), B = acct(t.to_account_id), out = [];
  if (isDebt(A)) out.push([A.currency, (t.kind === 'expense' || t.kind === 'transfer') ? -t.amount : +t.amount]);
  if (t.kind === 'transfer' && isDebt(B)) out.push([B.currency, +(t.to_amount ?? t.amount)]);
  return out;
}

/* ---------- 時間區間 ---------- */
const PRESETS = [['week', '本週'], ['month', '本月'], ['lastmonth', '上個月'], ['3m', '近 3 個月'], ['6m', '近 6 個月'], ['year', '今年'], ['lastyear', '去年'], ['all', '全部時間'], ['custom', '自訂日期']];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
// 回傳 [起（含）, 迄（不含）]，null 表示不限
function rangeOf(R) {

  switch (R.pre) {
    case 'week': { const t = new Date(y, n.getMonth(), n.getDate()); return [addDays(t, -((t.getDay() + 6) % 7)), null]; }
    case 'month': return [m0, null];
    case 'lastmonth': return [addMonths(m0, -1), m0];
    case '3m': return [addMonths(m0, -2), null];
    case '6m': return [addMonths(m0, -5), null];
    case 'year': return [new Date(y, 0, 1), null];
    case 'lastyear': return [new Date(y - 1, 0, 1), new Date(y, 0, 1)];

  }
}
function rangeLabel(R) {

  if (!f && !t) return '全部時間';
  return `${f ? fmt(f) : '最早'} – ${t ? fmt(addDays(t, -1)) : '今天'}`;
}
const applyRange = (q, R) => { const [f, t] = rangeOf(R); if (f) q = q.gte('occurred_at', f.toISOString()); if (t) q = q.lt('occurred_at', t.toISOString()); return q; };

function rangeBar(p, R) {

    ${R.pre === 'custom' ? `<div class="rangedates"><input type="date" id="${p}from" value="${f ? ymd(f) : ''}" aria-label="開始日期"><span class="muted">至</span><input type="date" id="${p}to" value="${t ? ymd(addDays(t, -1)) : ''}" aria-label="結束日期"><button type="button" class="btn small" id="${p}go">查詢</button></div>`

}

function flowSuggest(text) {
  const k = text.trim().toLowerCase(); if (!k) return '';

  const cats = S.cats.filter(c => !c.hidden && has(c.name)).map(c => ({ t: 'cat', id: c.id, all: !c.parent_id })).filter(g => !taken(g)).slice(0, 6);
  const accs = S.accts.filter(a => !a.hidden && has(a.name)).map(a => ({ t: 'acct', id: a.id })).filter(g => !taken(g)).slice(0, 6);
  const cps = [...S.cpMap.values()].filter(c => !c.hidden && has(c.name)).map(c => ({ t: 'cp', id: c.id })).filter(g => !taken(g)).slice(0, 6);
  const sec = (name, list) => list.length ? `<div class="sugh">${name}</div>${list.map(g => `<button type="button" class="sugi" data-tag='${esc(JSON.stringify(g))}'>${esc(tagLabel(g).replace(/^[^：]+：/, ''))}</button>`).join('')}` : '';
  const nls = k => S.nl[k].filter(x => !x.hidden && has(x.name)).map(x => ({ t: k, id: x.id })).filter(g => !taken(g)).slice(0, 6);
  const prs = nls('proj'), pys = nls('payee');

}

const KIND_LABEL = { expense: '支出', income: '收入', transfer: '轉帳', opening_balance: '期初餘額', balance_adjustment: '餘額調整' };
function txCsv(txs) {
  const q = v => { const x = v == null ? '' : String(v); return /[",\n\r]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; };
  const head = ['日期', '時間', '類型', '借方', '貸方', '金額', '幣別', '帳戶', '轉入帳戶', '轉入金額', '轉入幣別', '大分類', '子分類', '專案', '收付人', '借貸對象', '備註', '信用卡入帳日', '買賣', '股數', '單價', '手續費', '交易稅', '當沖', '分攤總額', '紀錄編號'];
  const rows = txs.map(t => {
    const d = new Date(t.occurred_at), A = acct(t.account_id), B = acct(t.to_account_id), c = S.catMap.get(t.category_id), p = c?.parent_id ? S.catMap.get(c.parent_id) : c, J = journal(t);
    return [ymd(d), `${pad(d.getHours())}:${pad(d.getMinutes())}`, t.trade_side ? (t.trade_side === 'buy' ? '投資買進' : '投資賣出') : KIND_LABEL[t.kind] || t.kind, J.dr, J.cr,
      t.amount, A?.currency || '', A?.name || '', B?.name || '', t.to_amount ?? '', B?.currency || '', p?.name || '', c?.parent_id ? c.name : '',
      nlName('proj', t.project_id), nlName('payee', t.payee_id), t.counterparty_id ? S.cpMap.get(t.counterparty_id)?.name || '' : '', t.memo || '', t.posted_on || '',
      t.trade_side === 'buy' ? '買' : t.trade_side === 'sell' ? '賣' : '', t.quantity ?? '', t.unit_price ?? '', t.fee ?? '', t.tax ?? '', t.day_trade ? '是' : '', t.split_total ?? '', t.id].map(q).join(',');
  });
  return '﻿' + [head.join(','), ...rows].join('\r\n');   // 加 BOM，Excel 開中文不會亂碼
}
function downloadText(text, name, type = 'text/csv;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([text], { type })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const fileSafe = x => String(x).replace(/[\\/:*?"<>|\s]+/g, '_');
function exportTxs(txs, label) {

// 改帳戶：一般收支改 account_id；投資買進改扣款帳戶（account_id）、賣出改入帳帳戶（to_account_id）

    <p class="hint" id="bnote" style="margin:0"></p>` : '<p class="hint">選取的紀錄都不是一般收支或投資相關的轉帳，沒有可以改帳戶的。</p>', root => {

    // 幣別不同不能直接換（金額會變成另一種貨幣）
    const plan = () => { const A = acct(+sel.value);
      const cur = t => acct(t[cashCol(t)])?.currency || 'TWD';
      const hit = ok.filter(t => !isInv(A) && cur(t) === (A.currency || 'TWD') && t[cashCol(t)] !== A.id);
      const same = ok.filter(t => t[cashCol(t)] === A.id).length, fx = ok.length - hit.length - same;
      return { A, hit, skip: ids.length - hit.length, same, fx, other: ids.length - ok.length }; };
    const show = () => { const { hit, same, fx, other } = plan();
      note.textContent = `會改 ${hit.length} 筆` + ([same && `${same} 筆本來就是這個帳戶`, fx && `${fx} 筆幣別不同`, other && `${other} 筆是轉帳、當沖等，請個別修改`].filter(Boolean).map((x, i) => (i ? '、' : '；略過：') + x).join('')) + '。'; };
    sel.onchange = show; show();
    $('#bf', root).onsubmit = async e => { e.preventDefault();
      const { A, hit, skip } = plan(); if (!hit.length) { $('#berr', root).textContent = '沒有可以改的紀錄。'; return; }
      if (isInv(A)) { $('#berr', root).textContent = '不能改成投資帳戶。'; return; }
      go.disabled = true;
      const fromIds = hit.filter(t => cashCol(t) === 'account_id').map(t => t.id), toIds = hit.filter(t => cashCol(t) === 'to_account_id').map(t => t.id);
      const row = { account_id: A.id }; if (!isCard(A)) row.posted_on = null;   // 不是信用卡就不需要入帳日
      let r = fromIds.length ? await sb.from('transactions').update(row).in('id', fromIds) : {};
      if (!r.error && toIds.length) r = await sb.from('transactions').update({ to_account_id: A.id }).in('id', toIds);
      if (r.error) { go.disabled = false; $('#berr', root).textContent = r.error.message; if (fromIds.length && toIds.length) await reloadAll(); return; }
      batchDone(hit.length, skip, A.name);
    };
  });
}

// 專案、收付人：任何種類的紀錄都可以設定，也可以一次清掉
function batchNamed(k, ids) {
  const N = NL[k];
  batchSheet(`把 ${ids.length} 筆改${N.label}`, `
    <div class="field"><label for="bnl">${N.label}</label><select id="bnl">${S.nl[k].filter(x => !x.hidden).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}<option value="__new">＋ 新增${N.label}…</option><option value="">（清除${N.label}）</option></select>
      <input id="bnln" placeholder="新${N.label}名稱" hidden style="margin-top:6px"></div>
    <p class="hint" style="margin:0">轉帳、投資等紀錄也會一起改。</p>`, root => {
    const sel = $('#bnl', root), inp = $('#bnln', root), go = $('#bgo', root);
    const sync = () => { inp.hidden = sel.value !== '__new'; if (!inp.hidden) inp.focus(); }; sel.onchange = sync; sync();
    $('#bf', root).onsubmit = async e => { e.preventDefault();
      go.disabled = true;
      try {
        if (sel.value === '__new' && !inp.value.trim()) throw new Error(`請輸入新${N.label}的名稱。`);
        const v = sel.value === '__new' ? await resolveNamed(k, inp.value) : sel.value ? +sel.value : null;
        const r = await sb.from('transactions').update({ [N.col]: v }).in('id', ids); if (r.error) throw r.error;
        batchDone(ids.length, 0, v ? nlName(k, v) : `沒有${N.label}`);

}

/* ---------- 帳戶 ---------- */
const GROUPS = [
  ['現金', ['cash']], ['電子錢包與儲值', ['e_wallet', 'stored_value']], ['銀行', ['bank']], ['信用卡', ['credit_card']],
  ['投資', ['stock', 'fund', 'investment']], ['債權與債務', ['receivable', 'payable']],
];
const TYPE_LABEL = { cash: '現金', e_wallet: '電子錢包', stored_value: '儲值卡', bank: '銀行', credit_card: '信用卡', stock: '股票', fund: '基金',
                     investment: '其他投資', receivable: '應收款項', payable: '應付款項' };
const CURRENCIES = ['TWD', 'USD', 'JPY', 'EUR', 'CNY', 'HKD', 'AUD', 'GBP', 'SGD', 'KRW', 'THB', 'VND'];
const natureOf = t => (t === 'credit_card' || t === 'payable') ? 'liability' : t === 'receivable' ? 'receivable' : 'asset';
const isLiabType = t => natureOf(t) === 'liability';
// 盤點：填每個帳戶的實際餘額，差額記成期初餘額（帳戶還沒有金額時）或餘額調整
function reconcile() {
  const rows = allGroups().map(([name, types]) => {
    const list = groupAccts(types, a => !a.hidden); if (!list.length) return '';
    const liab = types.some(isLiabType), inv = types.some(t => INV_TYPES.includes(t));
    return `<div class="sectionhead"><h2>${name}${liab ? '（填欠款）' : inv ? '（填成本）' : ''}</h2></div><div class="list">${list.map(a => {
      const b = S.bal.get(a.id) || 0, shown = isLiabType(a.account_type) ? -b : b;
      return `<label class="row recrow" for="rc${a.id}"><span class="main"><span class="t">${esc(a.name)}</span><span class="s">目前 ${money(shown, a.currency)}</span></span>
        <input id="rc${a.id}" data-rc="${a.id}" class="num" inputmode="decimal" placeholder="${nf.format(shown)}" aria-label="${esc(a.name)} 實際金額"></label>`; }).join('')}</div>`;
  }).join('');
  openSheet(`<div class="sheethead"><h2>盤點餘額</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
    <form class="form" id="rf">
      <p class="hint" style="margin:0">只要填和目前不一樣的帳戶，空白的不會變動。信用卡和應付款項填「欠多少」。系統會把差額記成一筆調整；帳戶原本是 0 的，會記成期初餘額。</p>
      <div class="field"><label for="rcd">盤點日期</label><input id="rcd" type="date" value="${toLocalInput(new Date()).slice(0, 10)}"></div>
      ${rows}
      <div class="card" style="box-shadow:none;background:var(--bg);padding:12px" id="rsum">尚未填寫任何帳戶。</div>
      <p class="hint" id="rerr" style="color:var(--inc)"></p>
      <button class="btn" type="submit">儲存盤點</button>
    </form>`, root => {
    const collect = () => {
      const out = [];
      for (const inp of $$('[data-rc]', root)) {
        const raw = inp.value.replace(/,/g, '').trim(); if (raw === '') continue;
        const n = parseFloat(raw); if (!isFinite(n)) return { err: `「${acct(+inp.dataset.rc).name}」的金額格式不對。` };
        const a = acct(+inp.dataset.rc), cur = S.bal.get(a.id) || 0, target = isLiabType(a.account_type) ? -n : n, diff = Math.round((target - cur) * 100) / 100;
        if (Math.abs(diff) >= 0.005) out.push({ a, cur, diff });
      }
      return { out };
    };
    const upd = () => {
      const { out, err } = collect(); const box = $('#rsum', root);
      if (err) { box.textContent = err; return; }
      box.innerHTML = out.length ? `會記錄 ${out.length} 筆：` + out.map(x => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.a.name)}${Math.abs(x.cur) < 0.005 ? '（期初）' : ''}</span><span class="num">${money(x.diff, x.a.currency, true)}</span></div>`).join('') : '尚未填寫任何帳戶，或填的金額和目前一樣。';
    };
    $$('[data-rc]', root).forEach(i => i.oninput = upd);
    $('#rf', root).onsubmit = async e => {
      e.preventDefault();
      const { out, err } = collect(); if (err) return $('#rerr', root).textContent = err;
      if (!out.length) return $('#rerr', root).textContent = '沒有需要調整的帳戶。';
      const d = new Date($('#rcd', root).value + 'T00:00'); if (isNaN(d)) return $('#rerr', root).textContent = '日期格式不對。';
      const rows = out.map(x => ({ ledger_id: S.ledger.id, account_id: x.a.id, amount: x.diff, occurred_at: d.toISOString(),
        kind: Math.abs(x.cur) < 0.005 ? 'opening_balance' : 'balance_adjustment', memo: Math.abs(x.cur) < 0.005 ? '期初餘額' : '盤點調整' }));
      const { error } = await sb.from('transactions').insert(rows);
      if (error) return $('#rerr', root).textContent = error.message;
      await reloadAll(); closeSheet(); toast(`已盤點 ${rows.length} 個帳戶`);
    };
  });
}
const bySort = (a, b) => ((a.sort_order ?? 1e9) - (b.sort_order ?? 1e9)) || (a.id - b.id);
const otherTypes = () => { const known = new Set(GROUPS.flatMap(g => g[1])); return [...new Set(S.accts.map(a => a.account_type).filter(t => !known.has(t)))]; };
const allGroups = () => [...GROUPS, ['其他', otherTypes()]];
const groupTypes = t => (allGroups().find(g => g[1].includes(t)) || [null, [t]])[1];
const groupAccts = (types, filter = () => true) => S.accts.filter(a => types.includes(a.account_type) && filter(a)).sort(bySort);
const nextSort = list => Math.max(0, ...list.map(x => x.sort_order || 0)) + 1;
// 排序：在序號欄輸入數字，該項移到那個位置，原本在那裡和之後的往下排
const ordInput = (id, pos, n) => `<input class="ordin" type="text" inputmode="numeric" value="${pos}" data-ord="${id}" data-pos="${pos}" aria-label="順序（1 到 ${n}）">`;
function bindOrderInputs(root, listFor, done) {
  $$('[data-ord]', root).forEach(inp => {
    inp.onfocus = () => inp.select();
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
    inp.onchange = async () => {
      const id = +inp.dataset.ord, list = listFor(id).map(x => x.id), from = list.indexOf(id);
      let to = parseInt(String(inp.value).replace(/\D/g, ''), 10);
      if (!to || from < 0) { inp.value = inp.dataset.pos; return; }
      to = Math.max(1, Math.min(list.length, to)) - 1;
      if (to === from) { inp.value = inp.dataset.pos; return; }
      list.splice(from, 1); list.splice(to, 0, id);
      await done(list);
    };
  });
}
async function saveOrder(table, ids) {

        fetchAll(() => sb.from('transactions').select('id,kind,account_id,to_account_id,amount,to_amount,occurred_at').eq('ledger_id', S.ledger.id).or(`account_id.eq.${id},to_account_id.eq.${id}`)
          .gte('occurred_at', from.toISOString()).lt('occurred_at', to.toISOString()).order('id'))]);

    drawRange(); loadDays().catch(fail);

}
// 信用卡帳單：依結帳日切出每一期

    const c = acct(t.account_id)?.currency || 'TWD'; by[c] ??= { e: 0, i: 0 }; by[c][t.kind === 'expense' ? 'e' : 'i'] += +t.amount; }
  return by;

// 分類佔比：依大分類加總，最多 6 塊（第 6 塊起併成「其他」），點圖例看子分類
function catShare(txs, kind, cur = 'TWD') {
  const top = new Map();
  for (const t of txs) { if (t.kind !== kind || (acct(t.account_id)?.currency || 'TWD') !== cur) continue;
    const c = S.catMap.get(t.category_id), p = c?.parent_id ? S.catMap.get(c.parent_id) : c, n = p?.name || '未分類';
    const e = top.get(n) || { name: n, sum: 0, kids: new Map() }; e.sum += +t.amount;
    if (c?.parent_id) e.kids.set(c.name, (e.kids.get(c.name) || 0) + +t.amount);
    top.set(n, e); }
  let list = [...top.values()].filter(x => x.sum > 0).sort((a, b) => b.sum - a.sum);
  if (list.length > 6) { const rest = list.slice(5); list = [...list.slice(0, 5), { name: '其他', sum: rest.reduce((a, x) => a + x.sum, 0), kids: new Map(rest.map(x => [x.name, x.sum])) }]; }
  return list;
}

function barChart(months, cur, series) {

    svg += `<text x="${pl + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${mm.getMonth() + 1}月</text>`;
  });

function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); for (const k of [1, 2, 5, 10]) if (k * p >= x) return k * p; return 10 * p; }

function catOptions(kind, selected, allowNew = false) {
  const tops = catTops(kind).filter(c => !c.hidden || c.id === selected);
  return tops.map(p => {
    const kids = catKids(p.id).filter(c => !c.hidden || c.id === selected);
    if (!kids.length) return `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}</option>`;
    return `<optgroup label="${esc(p.name)}">${p.id === selected ? `<option value="${p.id}" selected>${esc(p.name)}</option>` : ''}${kids.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`;
  }).join('') + (allowNew ? `<option value="__new" ${selected === '__new' ? 'selected' : ''}>＋ 新增分類…</option>` : '');
}
async function createCategory(kind, name, parentId, extra = {}) {
  name = (name || '').trim(); if (!name) throw new Error('請輸入新分類的名稱。');
  const sibs = parentId ? catKids(parentId) : catTops(kind);
  if (sibs.some(c => c.name === name)) throw new Error('同一層已經有這個分類。');
  const { data, error } = await sb.from('categories').insert({ ledger_id: S.ledger.id, name, kind, parent_id: parentId || null, sort_order: nextSort(sibs), ...extra }).select().single();
  if (error) throw error;
  S.cats.push(data); S.catMap.set(data.id, data); return data.id;
}

      if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = '再按一次刪除'; return; }

    const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
    const r = await fetch(SB_URL + '/auth/v1/health', { headers: { apikey: SB_KEY }, signal: c.signal });
    clearTimeout(t); return r.status < 500;
  } catch { return false; }
}
async function onSession(session) {
  if (!session) { S.user = null; booted = null; renderLogin(); return; }
  if (booted === session.user.id) return;
  booted = session.user.id; S.user = session.user;
  $('#app').innerHTML = '<div class="spinner">載入帳本…</div>';
  try { await ensureLedger(); LS.set('ledger', S.ledger.id); await loadRef(); renderShell(); }
  catch (e) { fail(e); $('#app').innerHTML = `<div class="login"><h1>載入失敗</h1><p>${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">重試</button></div>`; }
}
(async function boot() {
  if (location.hash === '#demo') return startDemo(false);
  if (location.hash === '#demo-empty') return startDemo(true);
  OFFLINE = !(await reachable());
  if (OFFLINE) return renderLogin();
  real.auth.onAuthStateChange((_ev, session) => { if (!DEMO) setTimeout(() => onSession(session), 0); });
  const { data } = await real.auth.getSession();
  if (!DEMO) onSession(data.session);
})();
</script>
